schema: IssueAssessment
version: 1
description: Clarification record for deciding whether one GitHub issue is ready for implementation.
required:
  - status
  - issue
  - locked_requirements
  - explicit_non_goals
  - assumptions
  - open_questions
  - implementation_ready
fields:
  status:
    type: enum
    values: [draft, needs_clarification, ready, blocked]
  prerequisite:
    type: object | null
    required: [required_contract, required_version, consumer, status, reason, next_step]
    fields:
      required_contract:
        type: enum
        values: [ProductInterview]
      required_version:
        type: integer
        minimum: 2
      consumer:
        type: enum
        values: [structure-issue]
      status:
        type: enum
        values: [missing, incomplete, unsupported_version, identity_mismatch]
      reason:
        type: string
      next_step:
        type: string
  issue:
    type: object
    required: [repository, number, url]
    fields:
      repository:
        type: string
        format: owner/repository
      number:
        type: integer | null
        minimum: 1
        constraints:
          - Required and minimum 1 for a loaded issue; null for a new request before publication.
      url:
        type: string | null
        format: uri
        constraints:
          - Required for a loaded issue; null for a new request before publication.
      current_title:
        type: string
      current_body:
        type: string
      current_labels:
        type: list
        items: string
      current_state:
        type: enum
        values: [open, closed, unknown]
  desired_outcome:
    type: string
  affected_user_or_problem:
    type: string
  current_behavior:
    type: string
  target_behavior:
    type: string
  locked_requirements:
    type: list
    items: string
  future_context:
    type: list
    items: string
  explicit_non_goals:
    type: list
    items: string
  assumptions:
    type: list
    items: string
  open_questions:
    type: list
    items: string
  platforms_and_integrations:
    type: list
    items: string
  technical_constraints:
    type: list
    items: string
  acceptance_criteria:
    type: list
    items: string
  verification_approach:
    type: list
    items: string
  proposed_labels:
    type: object
    required: [add, remove, preserve]
    fields:
      add:
        type: list
        items: string
      remove:
        type: list
        items: string
      preserve:
        type: list
        items: string
  implementation_ready:
    type: boolean
  publication_authorization:
    type: object
    fields:
      exact_draft_approved:
        type: boolean
      publication_authorized:
        type: boolean
      evidence:
        type: string | null
invariants:
  - A live issue is read before deterministic interpretation when one is supplied.
  - Locked requirements are user-confirmed or directly evidenced by the issue and repository.
  - Future context and explicit non-goals are not implementation requirements.
  - implementation_ready is false when open_questions contains a material product or scope decision.
  - New-request assessments preserve the verified repository identity and keep issue.number and issue.url null until publication; loaded-issue assessments preserve the exact issue identity.
  - prerequisite is null only when a matching ProductInterview version 2 was consumed; otherwise status is blocked and prerequisite identifies the missing or unusable interview.
  - A ready assessment does not authorize publication; publication_authorization is separate.
