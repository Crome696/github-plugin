schema: PrePrReadyGate
version: 2
description: >-
  Local, one-shot snapshot binding one exact authorized operation: either one
  standalone Ready-for-Review transition on a current open Draft pull request
  or one requested-reviewers POST after the transition. The snapshot binds the
  selected phase to one unique linked issue, complete pull-request identity,
  expected head SHA, typed reviewer set, GateLifecycle authority, and
  independent authorization.
required:
  - lifecycle
  - workspace
  - pull_request
  - expected_head_sha
  - is_draft
  - linked_issue
  - reviewers
  - authorization
  - written_at
fields:
  lifecycle:
    type: object
    required: [schema, version, operation, nonce, state, authorizes, issued_at, expires_at, consumed_at, receipt_expires_at]
    description: GateLifecycle authority with operation pre-pr-ready or pre-reviewer-request and a five-minute TTL.
  workspace:
    type: object
    required: [repository, path]
    fields:
      repository:
        type: string
        format: owner/repository
      path:
        type: string
        format: absolute-path
  pull_request:
    type: object
    required: [repository, number, url, base_branch, head_branch]
    fields:
      repository:
        type: string
        format: owner/repository
      number:
        type: integer
        minimum: 1
      url:
        type: string
        format: uri
      base_branch:
        type: string
      head_branch:
        type: string
  expected_head_sha:
    type: string
    format: full git commit SHA
  is_draft:
    type: boolean
  linked_issue:
    type: object
    required: [repository, number, url, unique]
    fields:
      repository:
        type: string
        format: owner/repository
      number:
        type: integer
        minimum: 1
      url:
        type: string
        format: uri
      unique:
        type: boolean
        const: true
  reviewers:
    type: object
    required: [add]
    fields:
      add:
        type: list
        items:
          type: object
          required: [kind, login]
          fields:
            kind:
              type: enum
              values: [user, team]
            login:
              type: string
              format: user-login or organization/team-slug
  authorization:
    type: object
    required:
      - exact_target
      - exact_ready_operation
      - ready_authorized
      - reviewers_authorized
      - source
      - evidence
    fields:
      exact_target:
        type: boolean
      exact_ready_operation:
        type: boolean
      ready_authorized:
        type: boolean
      reviewers_authorized:
        type: boolean
      source:
        type: enum
        values: [explicit_user, repository_policy]
      evidence:
        type: string
      approved_by:
        type: string | null
      approved_at:
        type: string | null
        format: iso-8601
  written_at:
    type: string
    format: iso-8601
invariants:
  - The gate is local, read-only input to the host hook and never grants Ready-for-Review authority by itself.
  - schema must be PrePrReadyGate and version must be exactly 2; incomplete legacy gates fail closed.
  - A pre-pr-ready authority has is_draft true and a pre-reviewer-request authority has is_draft false; both bind linked_issue.unique to the exact repository, pull request, URL, branches, and expected head SHA.
  - exact_target, exact_ready_operation, ready_authorized, and reviewers_authorized must all be true, including when reviewers.add is empty.
  - The host hook allows only the canonical standalone gh pr ready <number> --repo <owner>/<repo> operation while the live pull request is Draft and the lifecycle operation is pre-pr-ready.
  - The host hook allows only one canonical requested_reviewers POST after the pull request is non-Draft and the lifecycle operation is pre-reviewer-request; an empty reviewers.add set allows no reviewer API write.
  - User entries map to the API reviewers array; organization/team-slug entries map to team_reviewers after exact organization validation.
  - The hook never executes, rewrites, or broadens a Ready-for-Review transition, reviewer request, title, body, labels, or other pull-request metadata.
