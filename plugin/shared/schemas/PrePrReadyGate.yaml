schema: PrePrReadyGate
version: 1
description: >-
  Local, read-only snapshot binding two separate exact authorized operations:
  one standalone Ready-for-Review transition on a current open Draft pull
  request and, only when approved, one requested-reviewers POST after the
  transition. The snapshot binds both operations to one unique linked issue,
  complete pull-request identity, expected head SHA, typed reviewer set, and
  independent authorization.
required:
  - workspace
  - pull_request
  - expected_head_sha
  - is_draft
  - linked_issue
  - reviewers
  - authorization
  - written_at
fields:
  workspace:
    type: object
    required: [repository, path]
    fields:
      repository:
        type: string
        format: owner/repository
      path:
        type: string
        format: absolute-path
  pull_request:
    type: object
    required: [repository, number, url, base_branch, head_branch]
    fields:
      repository:
        type: string
        format: owner/repository
      number:
        type: integer
        minimum: 1
      url:
        type: string
        format: uri
      base_branch:
        type: string
      head_branch:
        type: string
  expected_head_sha:
    type: string
    format: full git commit SHA
  is_draft:
    type: boolean
    const: true
  linked_issue:
    type: object
    required: [repository, number, url, unique]
    fields:
      repository:
        type: string
        format: owner/repository
      number:
        type: integer
        minimum: 1
      url:
        type: string
        format: uri
      unique:
        type: boolean
        const: true
  reviewers:
    type: object
    required: [add]
    fields:
      add:
        type: list
        items:
          type: object
          required: [kind, login]
          fields:
            kind:
              type: enum
              values: [user, team]
            login:
              type: string
              format: user-login or organization/team-slug
  authorization:
    type: object
    required:
      - exact_target
      - exact_ready_operation
      - ready_authorized
      - reviewers_authorized
      - source
      - evidence
    fields:
      exact_target:
        type: boolean
      exact_ready_operation:
        type: boolean
      ready_authorized:
        type: boolean
      reviewers_authorized:
        type: boolean
      source:
        type: enum
        values: [explicit_user, repository_policy]
      evidence:
        type: string
      approved_by:
        type: string | null
      approved_at:
        type: string | null
        format: iso-8601
  written_at:
    type: string
    format: iso-8601
invariants:
  - The gate is local, read-only input to the host hook and never grants Ready-for-Review authority by itself.
  - schema must be PrePrReadyGate and version must be exactly 1; incomplete legacy gates fail closed.
  - is_draft must be true and linked_issue.unique must be true for the exact repository, pull request, URL, branches, and expected head SHA.
  - exact_target, exact_ready_operation, ready_authorized, and reviewers_authorized must all be true, including when reviewers.add is empty.
  - The host hook allows only the canonical standalone gh pr ready <number> --repo <owner>/<repo> operation while the live pull request is Draft.
  - After the live pull request is non-Draft, the host hook allows only one canonical requested_reviewers POST with exactly the authorized typed user/team set; an empty reviewers.add set allows no reviewer API write.
  - User entries map to the API reviewers array; organization/team-slug entries map to team_reviewers after exact organization validation.
  - The hook never executes, rewrites, or broadens a Ready-for-Review transition, reviewer request, title, body, labels, or other pull-request metadata.
