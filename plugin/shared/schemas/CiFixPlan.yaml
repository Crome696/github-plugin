schema: CiFixPlan
version: 1
description: Host-neutral, interactively confirmed plan for failed required checks on one existing pull-request head branch.
required:
  - status
  - pull_request
  - candidate_items
  - mandatory_item_ids
  - excluded_item_ids
  - scope
  - implementation_steps
  - capabilities
  - workspace
  - authorization
  - blockers
  - unresolved_questions
  - validation
  - risks
  - metadata
  - failure
fields:
  status:
    type: enum
    values: [draft, confirmed, partial, blocked]
  pull_request:
    type: object
    required: [repository, number, url, head_sha, head_branch, base_branch]
    fields:
      repository:
        type: string
        format: owner/repository
      number:
        type: integer
        minimum: 1
      url:
        type: string
        format: uri
      head_sha:
        type: string
      head_branch:
        type: string
      base_branch:
        type: string
      base_sha:
        type: string | null
      title:
        type: string | null
  candidate_items:
    type: list
    items:
      type: object
      required: [id, source, problem_core, decision, evidence, impact, correction, success_criteria]
      fields:
        id:
          type: string
        source:
          type: enum
          values: [required_check, wait_outcome]
        source_references:
          type: list
          items: string
        problem_core:
          type: string
        decision:
          type: enum
          values: [fix, skip, clarify, resolved]
        decision_reason:
          type: string | null
        evidence:
          type: list
          items: string
        check_name:
          type: string | null
        location:
          type: object | null
          required: [path]
          fields:
            path:
              type: string
            start_line:
              type: integer | null
            end_line:
              type: integer | null
        impact:
          type: string
        correction:
          type: string
        success_criteria:
          type: list
          items: string
        risk:
          type: enum
          values: [low, medium, high]
  mandatory_item_ids:
    type: list
    items: string
  excluded_item_ids:
    type: list
    items: string
  scope:
    type: object
    required: [in_scope, out_of_scope, exact_path_allowlist, scope_evidence]
    fields:
      in_scope:
        type: list
        items: string
      out_of_scope:
        type: list
        items: string
      exact_path_allowlist:
        type: list
        items: string
      scope_evidence:
        type: list
        items: string
  implementation_steps:
    type: list
    items:
      type: object
      required: [id, description, item_ids, status]
      fields:
        id:
          type: string
        description:
          type: string
        item_ids:
          type: list
          items: string
        status:
          type: enum
          values: [planned, in_progress, completed]
        evidence:
          type: list
          items: string
  capabilities:
    type: object
    required: [required_skills, applicable_rules, external_implementation]
    fields:
      required_skills:
        type: list
        items: string
      applicable_rules:
        type: list
        items: string
      external_implementation:
        type: object
        required: [required, capability_ids, status, gaps]
        fields:
          required:
            type: boolean
          capability_ids:
            type: list
            items: string
          status:
            type: enum
            values: [required, available, not_required, unavailable, blocked]
          gaps:
            type: list
            items: string
  workspace:
    type: object
    required: [operation, base_branch, branch_name, worktree_path, isolation_mode, primary_checkout_untouched]
    fields:
      operation:
        type: enum
        values: [attach_existing_branch, reuse_existing_worktree]
      base_branch:
        type: string
      base_sha:
        type: string | null
      branch_name:
        type: string
      worktree_path:
        type: string
        format: absolute-path
      isolation_mode:
        type: enum
        values: [dedicated_worktree, authorized_branch_fallback]
      existing_head_sha:
        type: string | null
      primary_checkout_untouched:
        type: boolean
      verification_evidence:
        type: list
        items: string
  authorization:
    type: object
    required: [source, task_scope, routine_operations, exact_scope_approved, commit_authorized, push_authorized, evidence, forbidden_operations]
    fields:
      source:
        type: enum
        values: [explicit_user, task_intent, plan_build, repository_policy, session_continuity]
      task_scope:
        type: string
      routine_operations:
        type: list
        items: string
      exact_scope_approved:
        type: boolean
      commit_authorized:
        type: boolean
      push_authorized:
        type: boolean
      evidence:
        type: list
        items: string
      forbidden_operations:
        type: list
        items: string
  blockers:
    type: list
    items:
      type: object
      required: [id, description, evidence]
      fields:
        id:
          type: string
        description:
          type: string
        evidence:
          type: list
          items: string
        status:
          type: string
  unresolved_questions:
    type: list
    items:
      type: object
      required: [id, question, impact, blocking, evidence]
      fields:
        id:
          type: string
        question:
          type: string
        impact:
          type: string
        blocking:
          type: boolean
        evidence:
          type: list
          items: string
  validation:
    type: object
    required: [required_tests, required_checks, success_criteria, reassess_required]
    fields:
      required_tests:
        type: list
        items: string
      required_checks:
        type: list
        items: string
      success_criteria:
        type: list
        items: string
      reassess_required:
        type: boolean
  risks:
    type: list
    items:
      type: object
      required: [severity, description, mitigation]
      fields:
        severity:
          type: string
        description:
          type: string
        mitigation:
          type: string
  metadata:
    type: object
    required: [plan_id, iteration, created_at, updated_at, confirmation_source]
    fields:
      plan_id:
        type: string
      iteration:
        type: integer
        minimum: 1
      created_at:
        type: string
        format: iso-8601
      updated_at:
        type: string
        format: iso-8601
      confirmation_source:
        type: string
  failure:
    type: object | null
    required: [code, message, operation, retryable, evidence]
    fields:
      code:
        type: string
      message:
        type: string
      operation:
        type: string
      retryable:
        type: boolean
      evidence:
        type: list
        items: string
invariants:
  - The plan identifies exactly one pull request and one current head SHA.
  - Every mandatory item is a failed or missing required check with an explicit fix decision and evidence.
  - Clarify items, unresolved questions, and blockers never enter the mandatory set.
  - Optional checks never become mandatory.
  - The plan authorizes only wait, exact required-check rerun, existing-head worktree attachment or reuse, one local commit, and one non-force push.
  - Forbidden review, thread, pull-request, Ready-for-Review, rebase, merge, force-push, deletion, cleanup, and default-branch operations remain explicit.
