schema: PreMergeGate
version: 3
description: Local, read-only snapshot binding one exact approved GitHub pull-request merge to one immutable readiness evidence snapshot and explicit merge authorization.
required:
  - workspace
  - pull_request
  - expected_head_sha
  - expected_base_sha
  - merge
  - authorization
  - preflight
  - readiness
  - written_at
fields:
  workspace:
    type: object
    required: [repository, path]
    fields:
      repository:
        type: string
        format: owner/repository
      path:
        type: string
        format: absolute-path
  pull_request:
    type: object
    required: [repository, number, url, base_branch, head_branch]
    fields:
      repository:
        type: string
        format: owner/repository
      number:
        type: integer
        minimum: 1
      url:
        type: string
        format: uri
      base_branch:
        type: string
      head_branch:
        type: string
  expected_head_sha:
    type: string
    format: full git commit SHA
  expected_base_sha:
    type: string
    format: full git commit SHA
  merge:
    type: object
    required: [method, delete_branch]
    fields:
      method:
        type: enum
        values: [merge, squash, rebase]
      commit_title:
        type: string | null
      commit_message:
        type: string | null
      delete_branch:
        type: boolean
  authorization:
    type: object
    required:
      - exact_target
      - exact_merge_operation
      - merge_authorized
      - delete_branch_authorized
      - source
      - evidence
    fields:
      exact_target:
        type: boolean
      exact_merge_operation:
        type: boolean
      merge_authorized:
        type: boolean
      delete_branch_authorized:
        type: boolean
      source:
        type: enum
        values: [explicit_user, repository_policy]
      evidence:
        type: string
      approved_by:
        type: string | null
      approved_at:
        type: string | null
        format: iso-8601
  preflight:
    type: object
    required: [checked_at, repository, pull_request_number, pull_request_url, head_branch, live_head_sha, live_base_sha, base_branch, target_match, open_state, non_draft, head_sha_match, base_branch_match, base_sha_match, mergeability, reviews_current, checks_current, method_allowed, authorization_match, evidence]
    fields:
      checked_at:
        type: string
        format: iso-8601
      repository:
        type: string
        format: owner/repository
      pull_request_number:
        type: integer
        minimum: 1
      pull_request_url:
        type: string
        format: uri
      head_branch:
        type: string
      live_head_sha:
        type: string
        format: full git commit SHA
      live_base_sha:
        type: string
        format: full git commit SHA
      base_branch:
        type: string
      target_match:
        type: enum
        values: [pass, fail, unknown]
      open_state:
        type: enum
        values: [pass, fail, unknown]
      non_draft:
        type: enum
        values: [pass, fail, unknown]
      head_sha_match:
        type: enum
        values: [pass, fail, unknown]
      base_branch_match:
        type: enum
        values: [pass, fail, unknown]
      base_sha_match:
        type: enum
        values: [pass, fail, unknown]
      mergeability:
        type: enum
        values: [pass, fail, unknown]
      reviews_current:
        type: enum
        values: [pass, fail, unknown]
      checks_current:
        type: enum
        values: [pass, fail, unknown]
      method_allowed:
        type: enum
        values: [pass, fail, unknown]
      authorization_match:
        type: enum
        values: [pass, fail, unknown]
      evidence:
        type: list
        items: string
  readiness:
    type: object
    description: Complete version-3 MergeReadiness handoff captured for the exact pull request and expected head SHA.
    required:
      - schema
      - version
      - status
      - repository
      - pull_request
      - head_sha
      - base_branch
      - mergeability
      - blockers
      - checks
      - review_state
      - issue_coverage
      - evidence
      - readiness_evidence
    fields:
      schema:
        type: string
        const: MergeReadiness
      version:
        type: integer
        const: 3
      status:
        type: enum
        values: [ready]
      repository:
        type: string
        format: owner/repository
      pull_request:
        type: object
        required: [number, url]
      head_sha:
        type: string
        format: full git commit SHA
      base_branch:
        type: string
      mergeability:
        type: enum
        values: [mergeable]
      blockers:
        type: list
        items:
          type: object
      checks:
        type: list
        items:
          type: object
      review_state:
        type: object
        required: [approval_count, change_request_count, evidence_status]
      issue_coverage:
        type: object
        required: [status, evidence]
      evidence:
        type: object
        required: [head_sha, status, sources]
      readiness_evidence:
        type: object
        required: [schema, version, status, repository, pull_request, head_sha, base, observed_at, freshness, policy, discussions, linked_issue, merge_methods, sources, failure]
        fields:
          schema:
            type: string
            value: PullRequestReadinessEvidence
          version:
            type: integer
            value: 1
          status:
            type: enum
            values: [complete]
          repository:
            type: string
            format: owner/repository
          pull_request:
            type: object
          head_sha:
            type: string
            format: full git commit SHA
          base:
            type: object
          observed_at:
            type: string
            format: iso-8601
          freshness:
            type: object
          policy:
            type: object
          discussions:
            type: object
          linked_issue:
            type: object
          merge_methods:
            type: object
          sources:
            type: list
            items: object
          failure:
            type: object | null
  written_at:
    type: string
    format: iso-8601
invariants:
  - The snapshot is local-only and is written immediately before one exact GitHub pull-request merge command; it never performs or authorizes a merge by itself.
  - The hook validates the complete version-3 MergeReadiness handoff, its embedded version-1 PullRequestReadinessEvidence, and the final live preflight without acquiring GitHub policy or network state itself.
  - readiness.status is ready, readiness.head_sha equals expected_head_sha, and readiness evidence is complete and identity-matched; readiness never substitutes for explicit merge authorization.
  - readiness.issue_coverage.status must be either `covered` or `waived`; when `waived`, the embedded `issue_coverage.waiver` object must be present and complete.
  - authorization.exact_target, authorization.exact_merge_operation, and authorization.merge_authorized are true and cover the exact repository, pull request, head and base SHAs, base branch, method, commit metadata, and branch-deletion effect.
  - preflight is the final live identity and policy handoff; its repository, PR number, URL, head/base branches, live head/base SHAs, and every required result equal the gate, and its evidence is non-empty.
  - A requested branch deletion requires authorization.delete_branch_authorized to be true; no branch is deleted implicitly.
  - Any changed, missing, stale, unavailable, ambiguous, failed, pending, skipped, or unknown merge condition blocks without repairing the condition or rewriting the snapshot.
