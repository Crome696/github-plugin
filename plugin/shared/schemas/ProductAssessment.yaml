schema: ProductAssessment
version: 1
description: Read-only product analysis of one parent GitHub issue as interview-prep, without creating sub-issues or inventing product decisions.
required:
  - status
  - source
  - topics
  - assumptions
  - implicit_requirements
  - mixed_features
  - unclear_decisions
  - open_questions
  - interview_focus
  - recommended_next_skill
  - failure
fields:
  status:
    type: enum
    values: [analyzed, partial, blocked]
  source:
    type: object | null
    required:
      - repository
      - number
      - url
      - loaded_issue_version
      - loaded_issue_status
      - unavailable_fields
    fields:
      repository:
        type: string | null
        format: owner/repository
      number:
        type: integer | null
        minimum: 1
      url:
        type: string | null
        format: uri
      loaded_issue_version:
        type: integer
      loaded_issue_status:
        type: enum
        values: [loaded, partial, blocked]
      unavailable_fields:
        type: list
        items: string
  topics:
    type: object
    required:
      - problem
      - desired_outcome
      - actors
      - use_cases
      - functional_requirements
      - business_rules
      - constraints
      - acceptance_criteria
      - dependencies
      - priorities
    fields:
      problem:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
      desired_outcome:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
      actors:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
      use_cases:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
      functional_requirements:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
      business_rules:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
      constraints:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
      acceptance_criteria:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
      dependencies:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
      priorities:
        type: list
        items:
          type: object
          required: [text, evidence, certainty]
          fields:
            text:
              type: string
            evidence:
              type: string
            certainty:
              type: enum
              values: [evidenced, inferred, uncertain]
  assumptions:
    type: list
    items:
      type: object
      required: [text, evidence, certainty]
      fields:
        text:
          type: string
        evidence:
          type: string
        certainty:
          type: enum
          values: [evidenced, inferred, uncertain]
  implicit_requirements:
    type: list
    items:
      type: object
      required: [text, evidence, certainty]
      fields:
        text:
          type: string
        evidence:
          type: string
        certainty:
          type: enum
          values: [evidenced, inferred, uncertain]
  mixed_features:
    type: list
    items:
      type: object
      required: [text, evidence, certainty]
      fields:
        text:
          type: string
        evidence:
          type: string
        certainty:
          type: enum
          values: [evidenced, inferred, uncertain]
  unclear_decisions:
    type: list
    items:
      type: object
      required: [text, evidence, certainty]
