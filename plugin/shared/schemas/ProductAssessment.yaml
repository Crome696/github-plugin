  recommended_next_skill:
    type: enum
    values:
      - conduct-product-interview
      - rewrite-github-issue
      - structure-issue
      - define-acceptance-criteria
      - none
  failure:
    type: object | null
    required: [code, message, operation, retryable]
    fields:
      code:
        type: enum
        values:
          - missing_input
          - invalid_input
          - unsupported_version
          - blocked_source
          - incomplete_source
          - analysis_failure
      message:
        type: string
      operation:
        type: string
      retryable:
        type: boolean
invariants:
  - source preserves the loaded issue identity, contract version, status, and unavailable fields without inventing replacements.
  - analyzed status requires a valid LoadedIssue version 1 with all evidence needed for the product assessment.
  - partial status means the assessment is possible but one or more material source fields are unavailable; failure identifies the incomplete source.
  - blocked status means the source is blocked or the input cannot be validated; topics and diagnostic inventories contain no fabricated issue facts.
  - Every inventory item is grounded in available issue, comment, metadata, linked-pull-request, label, or explicitly supplied repository evidence.
  - Certainty distinguishes retrieved evidence from interpretation; inferred and uncertain items are never presented as confirmed requirements.
  - mixed_features records independent outcomes or journeys in the parent issue as diagnosis only; this handoff never creates, publishes, or writes GitHub sub-issues.
  - interview_focus contains at most two prioritized follow-up topics for a later interview and does not itself ask the user those questions.
  - recommended_next_skill names at most one follow-up and does not authorize or invoke it.
  - failure is null for analyzed results and non-null for partial or blocked results.
