schema: ParentTrackerSynchronization
version: 1
description: >-
  Exact-evidence parent-issue tracker synchronization result for one complete
  ProductSubIssuePublication version-2 handoff. Records the live parent and
  child observations, deterministic owned-section rendering, exact body-only
  authorization, write effect, concurrency checks, and post-write
  verification without replacing the parent issue or changing unrelated
  metadata.
required:
  - status
  - repository
  - parent_issue
  - source_publication
  - children
  - owned_section
  - authorization
  - operation
  - verification
  - evidence
  - failure
  - metadata
fields:
  status:
    type: enum
    values: [draft, approved, no-op, updated, partial, blocked]
  repository:
    type: object
    required: [owner, name, full_name, url, default_branch]
    fields:
      owner:
        type: string
      name:
        type: string
      full_name:
        type: string
        format: owner/repository
      url:
        type: string
        format: uri
      default_branch:
        type: string
    constraints:
      - owner, name, full_name, and url identify exactly one repository.
  parent_issue:
    type: object
    required: [number, url, title, state, body, updated_at, loaded_at, revision]
    fields:
      number:
        type: integer
        minimum: 1
      url:
        type: string
        format: uri
      title:
        type: string
      state:
        type: enum
        values: [open, closed]
      body:
        type: string
      updated_at:
        type: string
        format: iso-8601
      loaded_at:
        type: string
        format: iso-8601
      revision:
        type: object
        required: [updated_at, body_digest, evidence]
        fields:
          updated_at:
            type: string
            format: iso-8601
          body_digest:
            type: string
            format: sha256-lowercase-hex
          evidence:
            type: list
            items: string
    constraints:
      - The body and updated_at values are the current live baseline used for rendering and the concurrency gate.
      - Parent identity must match the source publication exactly.
  source_publication:
    type: object
    required: [schema, version, status, repository, parent_issue, canonical_set, authorization, adapter, mapping, relationships, failed_operations, omitted_units, evidence, failure]
    fields:
      schema:
        type: string
        const: ProductSubIssuePublication
      version:
        type: integer
        const: 2
      status:
        type: enum
        values: [published, partial, blocked]
      repository:
        type: string
        format: owner/repository
      parent_issue:
        type: object
        required: [number, url]
        fields:
          number:
            type: integer
            minimum: 1
          url:
            type: string
            format: uri
      canonical_set:
        type: object
        required: [schema, version, canonicalization_version, algorithm, digest, unit_ids]
        fields:
          schema:
            type: string
            const: ProductSubIssueDrafts
          version:
            type: integer
            const: 2
          canonicalization_version:
            type: integer
            const: 1
          algorithm:
            type: enum
            values: [sha256]
          digest:
            type: string
            format: sha256-lowercase-hex
          unit_ids:
            type: list
            items: string
      authorization:
        type: object
        required: [source, task_scope, publication_authorized, exact_payload, exact_set, canonical_set_digest, evidence]
        fields:
          source:
            type: enum
            values: [task_intent, user_approval, repository_policy]
          task_scope:
            type: string
          publication_authorized:
            type: boolean
          exact_payload:
            type: boolean
          exact_set:
            type: boolean
          canonical_set_digest:
            type: string | null
            format: sha256-lowercase-hex
          evidence:
            type: list
            items: string
      adapter:
        type: object
        required: [status, source_schema, source_version, target_schema, target_version, verified_units, evidence]
        fields:
          status:
            type: enum
            values: [verified, partial, blocked]
          source_schema:
            type: string
            const: ProductSubIssueDrafts
          source_version:
            type: integer
            const: 2
          target_schema:
            type: string
            const: IssueDraft
          target_version:
            type: integer
            const: 2
          verified_units:
            type: list
            items: string
          evidence:
            type: list
            items: string
      mapping:
        type: list
        items:
          type: object
          required: [unit_id, issue_number, issue_url, operation, adapter_verified]
          fields:
            unit_id:
              type: string
            issue_number:
              type: integer
              minimum: 1
            issue_url:
              type: string
              format: uri
            operation:
              type: enum
              values: [created, reused]
            adapter_verified:
              type: boolean
            title:
              type: string | null
            confirmed_class:
              type: enum
              values: [must, should, could, later, unconfirmed]
      failed_operations:
        type: list
        items:
          type: object
      omitted_units:
        type: list
        items:
          type: object
      relationships:
        type: object
        required: [parent_links, dependencies]
        fields:
          parent_links:
            type: list
            items: object
          dependencies:
            type: list
            items:
              type: object
      failure:
        type: object | null
        fields:
          code:
            type: string
          message:
            type: string
          phase:
            type: string
          retryable:
            type: boolean
          evidence:
            type: list
            items: string
      evidence:
        type: list
        items: string | object
    constraints:
      - The complete publication must be ProductSubIssuePublication v2 with status published.
      - Its digest, unit count, and unique unit IDs must match the canonical ProductSubIssueDrafts v2 set.
      - Every adapter must be verified, every mapped unit must occur exactly once, failed_operations and omitted_units must be empty, and parent links and hard dependencies must be verified.
  children:
    type: list
    items:
      type: object
      required: [unit_id, issue_number, issue_url, observed_state, observed_at, evidence]
      fields:
        unit_id:
          type: string
        issue_number:
          type: integer
          minimum: 1
        issue_url:
          type: string
          format: uri
        observed_state:
          type: enum
          values: [open, merged, closed]
        observed_at:
          type: string
          format: iso-8601
        issue_updated_at:
          type: string | null
          format: iso-8601
        evidence:
          type: list
          items: string
        merge_pr:
          type: object | null
          required: [repository, number, url, state, merged_at, base_branch, base_sha, merge_commit_sha, evidence]
          fields:
            repository:
              type: string
              format: owner/repository
            number:
              type: integer
              minimum: 1
            url:
              type: string
              format: uri
            state:
              type: enum
              values: [merged]
            merged_at:
              type: string
              format: iso-8601
            base_branch:
              type: string
            base_sha:
              type: string
              format: full git commit SHA
            merge_commit_sha:
              type: string
              format: full git commit SHA
            evidence:
              type: list
              items: string
    constraints:
      - Each publication mapping appears exactly once in children.
      - open means the current child issue is open.
      - merged means the current child issue is closed and the supplied merge_pr is current, causal, unambiguous, and verified.
      - closed means the current child issue is closed without verified causal merge-pr evidence.
      - Missing, stale, contradictory, or ambiguous child evidence blocks the parent write; state is never guessed.
  owned_section:
    type: object
    required: [marker_version, start_marker, end_marker, body, rows, order]
    fields:
      marker_version:
        type: integer
        const: 1
      start_marker:
        type: string
        const: '<!-- github-plugin:parent-tracker:start -->'
      end_marker:
        type: string
        const: '<!-- github-plugin:parent-tracker:end -->'
      body:
        type: string
      rows:
        type: list
        items:
          type: object
          required: [unit_id, issue_number, issue_url, state]
          fields:
            unit_id:
              type: string
            issue_number:
              type: integer
              minimum: 1
            issue_url:
              type: string
              format: uri
            state:
              type: enum
              values: [open, merged, closed]
      order:
        type: enum
        values: [issue_number_ascending_then_unit_id]
    constraints:
      - The rendered body is exactly the marker-delimited deterministic Markdown table.
      - Markers are each on their own line and are not nested.
  authorization:
    type: object
    required: [mode, source, task_scope, exact_target, exact_body, update_authorized, approved_body, evidence]
    fields:
      mode:
        type: enum
        values: [integrated, standalone]
      source:
        type: enum
        values: [explicit_user, task_intent, plan_build, repository_policy, session_continuity]
      task_scope:
        type: string
      exact_target:
        type: boolean
      exact_body:
        type: boolean
      update_authorized:
        type: boolean
      approved_body:
        type: string
      approved_parent:
        type: object | null
        fields:
          repository:
            type: string
          number:
            type: integer
            minimum: 1
          url:
            type: string
            format: uri
      source_publication_digest:
        type: string
        format: sha256-lowercase-hex
      evidence:
        type: list
        items: string
    constraints:
      - Integrated authorization is task-bound to the exact parent and exact complete body produced by this run.
      - Standalone reruns require their own exact body-update authorization; the original publication authorization is insufficient.
      - Authorization never covers title, labels, assignees, milestone, state, comments, or other issue metadata.
  operation:
    type: object
    required: [status, external_write, write_effect, issue_update]
    fields:
      status:
        type: enum
        values: [not_started, no_op, updated, partial]
      external_write:
        type: boolean
      write_effect:
        type: enum
        values: [none, body_only, unknown]
      issue_update:
        type: object | null
        fields:
          schema:
            type: string
            const: IssueUpdate
          version:
            type: integer
            const: 1
          status:
            type: enum
            values: [draft, approved, completed, partial, blocked]
          operation:
            type: enum
            values: [not_started, no_op, updated, partial]
          evidence:
            type: list
            items: string
  verification:
    type: object
    required: [target_identity, baseline, concurrency, post_write, owned_section, outside_owned_block, metadata_preserved, evidence]
    fields:
      target_identity:
        type: enum
        values: [pass, fail, unknown]
      baseline:
        type: enum
        values: [loaded, unavailable, conflicting]
      concurrency:
        type: enum
        values: [pass, edit_conflict, unknown]
      post_write:
        type: enum
        values: [pass, fail, unknown, not_applicable]
      owned_section:
        type: enum
        values: [pass, fail, unknown]
      outside_owned_block:
        type: enum
        values: [preserved, changed, unknown]
      metadata_preserved:
        type: enum
        values: [preserved, changed, unknown]
      evidence:
        type: list
        items: string
    constraints:
      - The parent updated_at baseline is reloaded immediately before a write.
      - Body drift or a changed updated_at produces edit_conflict and no write.
      - Post-write verification must prove exact parent identity, exact owned body, unchanged bytes outside the owned block, and unchanged title, labels, assignees, milestone, state, comments, and history.
  evidence:
    type: list
    items:
      type: object
      required: [source, reference, observed]
      fields:
        source:
          type: enum
          values: [github, handoff, user_decision, repository_policy]
        reference:
          type: string
        observed:
          type: string
  failure:
    type: object | null
    required: [code, message, phase, retryable, external_write, evidence]
    fields:
      code:
        type: enum
        values:
          - missing_input
          - unsupported_version
          - legacy_input
          - publication_incomplete
          - identity_mismatch
          - mapping_incomplete
          - child_state_unavailable
          - child_state_ambiguous
          - malformed_owned_section
          - approval_missing
          - edit_conflict
          - api_failure
          - verification_incomplete
      message:
        type: string
      phase:
        type: enum
        values: [input, parent_read, child_read, render, approval, conflict_check, write, verification]
      retryable:
        type: boolean
      external_write:
        type: boolean
      evidence:
        type: list
        items: string
  metadata:
    type: object
    required: [started_at, completed_at, rerun, conversation_language]
    fields:
      started_at:
        type: string
        format: iso-8601
      completed_at:
        type: string | null
        format: iso-8601
      rerun:
        type: boolean
      conversation_language:
        type: string
      unavailable_fields:
        type: list
        items: string
      assumptions:
        type: list
        items: string
      uncertainties:
        type: list
        items: string
invariants:
  - Exactly one repository, one parent issue, one current parent body, one current parent updated_at, and one complete ProductSubIssuePublication v2 are bound to the result.
  - Only ProductSubIssuePublication v2 with status published is accepted; v1, legacy, partial, blocked, stale, or contradictory publications return blocked or partial with no parent write.
  - The source digest and unit count equal the canonical ProductSubIssueDrafts v2 identity; every unit is mapped once, every adapter is verified, failed_operations and omitted_units are empty, and parent links and hard dependencies are verified before rendering.
  - Child state is open only from a current open issue, merged only from a current closed issue plus complete causal merge-pr evidence, and closed only from a current closed issue without verified causal merge-pr evidence.
  - A missing, conflicting, stale, or ambiguous issue or merge-pr observation never becomes a guessed state and prevents a parent write.
  - The exact markers are each on their own line. No marker pair appends or replaces content when the pair is missing, duplicated, reversed, nested, or otherwise malformed; the result is blocked with no write.
  - The owned section is rendered with the exact markers and table columns Unit, Issue, URL, and State; rows sort numerically by issue number and then by unit_id.
  - Bytes outside the owned block and the parent's existing line-ending convention are preserved. A new body without an identifiable convention uses LF.
  - An identical complete body is a no-op and performs no GitHub write.
  - A write delegates only a body-only IssueUpdate v1 handoff; title, labels, assignees, milestone, state, comments, history, and other metadata are never mutation fields.
  - Integrated and standalone runs each require exact authorization for the exact parent and complete final body; publication authorization alone cannot authorize a later rerun.
  - A write is reported updated only after exact post-write verification. An uncertain or failed write is partial when an external effect may have occurred and blocked when no external write occurred.
