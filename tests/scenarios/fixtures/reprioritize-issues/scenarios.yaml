schema: CommandScenario
version: 1
scenarios:
  - id: reprioritize-issues-happy-path
    command: reprioritize-issues
    description: Applies confirmed unique P-number titles after exact ranked-set approval.
    expected:
      status: completed
      successful_writes: [apply-issue-priority-titles]
      preserved_artifacts: []
    target:
      repository: &repo octo-org/widgets
      exact: true
    facts: {}
    authorizations:
      routine: true
      issue_reprioritize: true
    handoffs: &ranked_handoffs
      OpenIssueInventory:
        patch: {}
      OpenIssueRanking:
        patch: &ranked_patch
          status: ranked
          authorization:
            ranking_confirmed: true
            exact_payload: true
            exact_set: true
            source: explicit_user
            evidence:
              - User confirmed the exact P1-P2 title set.
    actions: &reprioritize_actions
      - operation: verify-repository
        effect: read
      - operation: list-open-issues
        effect: read
        handoff: OpenIssueInventory
      - operation: rank-open-issues
        effect: read
        handoff: OpenIssueRanking
      - operation: apply-issue-priority-titles
        effect: write
        handoff: IssueReprioritization

  - id: reprioritize-issues-missing-repository
    command: reprioritize-issues
    description: Refuses title writes when the repository target is absent.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: apply-issue-priority-titles
      preserved_artifacts: []
    target:
      repository: null
      exact: false
    facts: {}
    authorizations:
      routine: true
      issue_reprioritize: true
    handoffs: {}
    actions: *reprioritize_actions

  - id: reprioritize-issues-missing-ranked-set-approval
    command: reprioritize-issues
    description: Refuses title writes when ranked-set approval is absent.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: apply-issue-priority-titles
      preserved_artifacts: []
    target:
      repository: *repo
      exact: true
    facts: {}
    authorizations:
      routine: true
      issue_reprioritize: false
    handoffs: *ranked_handoffs
    actions: *reprioritize_actions

  - id: reprioritize-issues-unconfirmed-ranking
    command: reprioritize-issues
    description: Refuses title writes when the ranking is only recommended.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: apply-issue-priority-titles
      preserved_artifacts: []
    target:
      repository: *repo
      exact: true
    facts: {}
    authorizations:
      routine: true
      issue_reprioritize: true
    handoffs:
      OpenIssueInventory:
        patch: {}
      OpenIssueRanking:
        patch: {}
    actions: *reprioritize_actions

  - id: reprioritize-issues-live-set-changed
    command: reprioritize-issues
    description: Refuses title writes when live open-issue numbers no longer match the ranking.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: apply-issue-priority-titles
      preserved_artifacts: []
    target:
      repository: *repo
      exact: true
    facts: {}
    authorizations:
      routine: true
      issue_reprioritize: true
    handoffs:
      OpenIssueInventory:
        patch: {}
      OpenIssueRanking:
        patch:
          <<: *ranked_patch
          source:
            issue_numbers: [11]
    actions: *reprioritize_actions

  - id: reprioritize-issues-api-error
    command: reprioritize-issues
    description: Preserves a partial result when a title write fails.
    expected:
      status: partial
      successful_writes: []
      blocked_operation: apply-issue-priority-titles
      preserved_artifacts: []
    target:
      repository: *repo
      exact: true
    facts:
      api_errors: [apply-issue-priority-titles]
    authorizations:
      routine: true
      issue_reprioritize: true
    handoffs: *ranked_handoffs
    actions:
      - operation: verify-repository
        effect: read
      - operation: list-open-issues
        effect: read
        handoff: OpenIssueInventory
      - operation: rank-open-issues
        effect: read
        handoff: OpenIssueRanking
      - operation: apply-issue-priority-titles
        effect: write
        result: api-error
        handoff: IssueReprioritization
