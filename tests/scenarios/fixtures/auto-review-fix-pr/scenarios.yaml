schema: CommandScenario
version: 1

defaults:
  repository: &repo octo-org/widgets
  pull_request_number: &pr 42
  head_sha: &head bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  head_branch: &branch feature/review-fix
  worktree_path: &worktree C:/workspace/review-fix
  target: &target
    repository: *repo
    pull_request_number: *pr
    head_sha: *head
    exact: true
  authorizations: &authorizations
    routine: true
    workspace_attachment: true
    commit: true
    push: true
  review_handoffs: &review_handoffs
    LoadedPullRequest:
      patch:
        pull_request:
          repository: *repo
          number: *pr
          url: https://github.com/octo-org/widgets/pull/42
        title: Review-fix fixture
        state: open
        is_draft: false
        base:
          ref: main
          sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          repository: *repo
        head:
          ref: *branch
          sha: *head
          repository: *repo
    LinkedIssue: {}
    LoadedPullRequestDiscussions: {}
    PullRequestCheckInspection: {}
    PullRequestDiffAnalysis: {}
    DetectedReviewFindings: {}
    DeduplicatedReviewFindings: {}
    ClassifiedReviewFindings:
      patch:
        repository: *repo
        pull_request:
          number: *pr
          url: https://github.com/octo-org/widgets/pull/42
        head_sha: *head
        source:
          finding_count: 1
          uncertainty_count: 0
          suppressed_count: 0
          findings_preserved: 1
          evidence:
            - Current head diff was inspected.
        findings:
          - id: F-001
            status: proposed
            category: correctness
            severity: major
            confidence: high
            needs_discussion: false
            discussion_reason: null
            classification_rationale: The changed branch returns an invalid value for the empty input case.
            location:
              path: src/feature.ts
              start_line: 10
              end_line: 10
              side: RIGHT
              commit_sha: *head
            evidence: src/feature.ts line 10 admits an empty input.
            impact: The pull request can return an invalid result for valid input.
            recommendation: Guard the empty input before the changed branch.
            verification: Add and run the empty-input regression test.
            sources: [diff_analysis]
            references: [diff:F-001]
            merged_from: [F-001]
            related_threads: []
    CollectedReviewFeedback: {}
    ResolvedReviewFeedback: {}
    ClassifiedReviewFeedback:
      patch:
        pull_request:
          repository: *repo
          number: *pr
          url: https://github.com/octo-org/widgets/pull/42
          head_sha: *head
        classifications:
          - id: FB-001
            source_item_id: FB-001
            triage_status: open
            cause: code_change
            severity: major
            affected_component: src/feature.ts
            required_action: change_code
            evidence: [The open feedback identifies the same invalid empty-input behavior.]
            impact: Valid empty input can produce an invalid result.
            classification_rationale: The feedback points to the changed branch and is actionable.
            confidence: high
            needs_discussion: false
            discussion_reason: null
            references: [thread:FB-001]
        summary:
          total: 1
          open: 1
          resolved: 0
          outdated: 0
          addressed: 0
          uncertain: 0
    ReviewFixPlan:
      patch:
        status: confirmed
        pull_request:
          repository: *repo
          number: *pr
          url: https://github.com/octo-org/widgets/pull/42
          head_sha: *head
          head_branch: *branch
          base_branch: main
          title: Review-fix fixture
        candidate_items:
          - id: F-001
            source: diff_finding
            source_references: [diff:F-001, thread:FB-001]
            problem_core: Empty input reaches the changed branch without a guard.
            decision: fix
            decision_reason: Mandatory correctness fix confirmed for this iteration.
            evidence:
              - src/feature.ts line 10 admits an empty input.
              - Open feedback FB-001 identifies the same behavior.
            location:
              path: src/feature.ts
              start_line: 10
              end_line: 10
              check_id: null
            impact: Valid empty input can produce an invalid result.
            severity: major
            confidence: high
            correction: Guard the empty input before the changed branch.
            success_criteria:
              - Empty input is handled by the guarded path.
              - The regression test passes.
            risk: medium
            status: new
        mandatory_item_ids: [F-001]
        excluded_item_ids: []
        scope:
          in_scope: [src/feature.ts, tests/feature.test.ts]
          out_of_scope: [Review publication, thread writes, merge, cleanup]
          exact_path_allowlist: [src/feature.ts, tests/feature.test.ts]
          scope_evidence: [Candidate F-001 names both affected paths.]
        implementation_steps:
          - id: fix-F-001
            description: Add the guard and regression test for empty input.
            item_ids: [F-001]
            status: planned
            evidence: [Confirmed ReviewFixPlan candidate F-001.]
        capabilities:
          required_skills: [session:skill:typescript-implementation]
          applicable_rules: [plugin/rules/interactive-approval.mdc]
          external_implementation:
            required: true
            capability_ids: [session:skill:typescript-implementation]
            status: available
            gaps: []
        workspace:
          operation: attach_existing_branch
          base_branch: main
          base_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          branch_name: *branch
          worktree_path: *worktree
          isolation_mode: dedicated_worktree
          existing_head_sha: *head
          primary_checkout_untouched: true
          verification_evidence: [Existing PR head branch is registered.]
        authorization:
          source: task_intent
          task_scope: pr:42
          routine_operations: [workspace_attach, commit, push]
          exact_scope_approved: true
          commit_authorized: true
          push_authorized: true
          evidence: [Task-scoped auto-review-fix-pr authorization.]
          forbidden_operations: [submit-pr-review, create-draft-pr, merge-pull-request]
        blockers: []
        unresolved_questions: []
        validation:
          required_tests: [npm test -- feature]
          required_checks: []
          success_criteria: [Candidate F-001 is resolved by current validation.]
          re_review_required: true
        risks: []
        metadata:
          plan_id: review-fix-plan-scenario
          iteration: 1
          created_at: '2026-01-01T00:00:00.000Z'
          updated_at: '2026-01-01T00:00:00.000Z'
          confirmation_source: user
        failure: null
    BranchWorkspace:
      patch:
        status: planned
        repository: *repo
        base_branch: main
        base_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        branch_name: *branch
        worktree_path: *worktree
        isolation_mode: dedicated_worktree
        primary_checkout_untouched: true
    ContextCapabilities:
      patch:
        status: resolved
        missing_capabilities: []
        failure: null
    WorkingTreeInspection:
      patch:
        status: inspected
        repository: *repo
        branch_name: *branch
        worktree_path: *worktree
        identity:
          branch_matches_expected: true
          worktree_registered: true
          is_primary_checkout: false
    ChangeClassification:
      patch:
        status: classified
        repository: *repo
        branch_name: *branch
        worktree_path: *worktree
        source:
          implementation_plan_version: null
          loaded_issue_version: null
          issue_analysis_version: null
          affected_areas_version: null
        summary:
          scope_alignment: aligned
        evidence: [Changed paths match ReviewFixPlan scope.]
    UnrelatedChangeDetection:
      patch:
        status: clear
        repository: *repo
        branch_name: *branch
        worktree_path: *worktree
        source:
          implementation_plan_version: null
          loaded_issue_version: null
          issue_analysis_version: null
          affected_areas_version: null
        findings: []
        blockers: []
        clarifications: []
    ValidationResult:
      patch:
        status: passed
        workspace:
          path: *worktree
          branch: *branch
          head_sha: *head
        checks: []
        required_checks_passed: true
        source:
          implementation_plan_version: null
          loaded_issue_version: null
          issue_analysis_version: null
          branch_workspace_version: 1
          references: [ReviewFixPlan]
          unavailable_inputs: []
        evaluation:
          scope:
            status: aligned
            evidence: [Changed paths match ReviewFixPlan scope.]
          acceptance_criteria: []
          completion_criteria: []
          planned_steps: []
          unexpected_changes: []
          documented_deviations: []
        blockers: []
        warnings: []
        readiness:
          commit_preparation_allowed: true
          draft_pr_preparation_allowed: false
          reasons: [Review-fix commit scope is validated.]
    CommitProposal:
      patch:
        status: approved
        repository: *repo
        branch: *branch
        base_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        head_sha: *head
        files:
          added: [tests/feature.test.ts]
          modified: [src/feature.ts]
          deleted: []
        message:
          subject: Fix empty-input handling
          body: Guard the changed branch and cover the reported input.
        validation:
          result_status: passed
          evidence: [ValidationResult passed with aligned ReviewFixPlan scope.]
        authorization:
          exact_scope_approved: true
          commit_authorized: true
          source: task_intent
          task_scope: pr:42
          evidence: Task-scoped review-fix authorization.
    PreCommitGate:
      patch:
        workspace:
          repository: *repo
          path: *worktree
          branch: *branch
          head_sha: *head
        validation:
          status: passed
          readiness:
            commit_preparation_allowed: true
        commit_proposal:
          status: approved
          repository: *repo
          authorization:
            exact_scope_approved: true
            commit_authorized: true
    BranchPush:
      patch:
        status: verified
        repository: *repo
        branch_name: *branch
        worktree_path: *worktree
        remote:
          owner_repository: *repo
          url_sanitized: https://github.com/octo-org/widgets.git
        local:
          head_sha: *head
          branch_match: true
          dirty: false
          detached: false
          in_progress_operation: null
        push:
          attempted: true
          forced: false
          remote_sha: *head
          result: success
        authorization:
          push_authorized: true
          force_push_authorized: false
        verification:
          repository_match: pass
          branch_match: pass
          remote_branch_exists: pass
          sha_match: pass
          upstream_configured: pass
  review_actions: &review_actions
    - operation: verify-repository
      effect: read
    - operation: load-pull-request
      effect: read
    - operation: load-linked-issue
      effect: read
    - operation: load-pr-discussions
      effect: read
    - operation: inspect-pr-checks
      effect: read
    - operation: analyze-pr-diff
      effect: read
    - operation: detect-review-findings
      effect: read
    - operation: deduplicate-review-findings
      effect: read
    - operation: classify-review-findings
      effect: read
    - operation: collect-review-feedback
      effect: read
    - operation: identify-resolved-feedback
      effect: read
    - operation: classify-review-feedback
      effect: read
    - operation: build-review-fix-plan
      effect: read
    - operation: create-worktree
      effect: write
    - operation: verify-worktree
      effect: read
    - operation: handoff-external-implementation
      effect: read
    - operation: inspect-working-tree
      effect: read
    - operation: classify-changes
      effect: read
    - operation: detect-unrelated-changes
      effect: read
    - operation: validate-implementation-result
      effect: read
    - operation: compose-commit-message
      effect: read
    - operation: create-commit
      effect: write
    - operation: push-branch
      effect: write

scenarios:
  - id: auto-review-fix-pr-happy-path
    command: auto-review-fix-pr
    description: Confirms one current finding, attaches the existing PR branch, commits, pushes, and completes the loop.
    expected:
      status: completed
      successful_writes: [create-worktree, create-commit, push-branch]
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs:
      <<: *review_handoffs
    actions: *review_actions

  - id: auto-review-fix-pr-no-mandatory-items
    command: auto-review-fix-pr
    description: Completes a clean re-review without entering the worktree or delivery path.
    expected:
      status: completed
      successful_writes: []
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs:
      <<: *review_handoffs
      ClassifiedReviewFindings:
        patch:
          source:
            finding_count: 0
            findings_preserved: 0
          findings: []
      ClassifiedReviewFeedback:
        patch:
          classifications: []
          summary:
            total: 0
            open: 0
            resolved: 0
            outdated: 0
            addressed: 0
            uncertain: 0
      ReviewFixPlan:
        patch:
          candidate_items: []
          mandatory_item_ids: []
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
      - operation: load-pr-discussions
        effect: read
      - operation: inspect-pr-checks
        effect: read
      - operation: analyze-pr-diff
        effect: read
      - operation: detect-review-findings
        effect: read
      - operation: deduplicate-review-findings
        effect: read
      - operation: classify-review-findings
        effect: read
      - operation: collect-review-feedback
        effect: read
      - operation: identify-resolved-feedback
        effect: read
      - operation: classify-review-feedback
        effect: read
      - operation: build-review-fix-plan
        effect: read

  - id: auto-review-fix-pr-missing-identity
    command: auto-review-fix-pr
    description: Stops before attaching a worktree when the exact pull-request identity is absent.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: create-worktree
      preserved_artifacts: []
    target:
      <<: *target
      pull_request_number: null
      exact: false
    facts: {}
    authorizations: *authorizations
    handoffs:
      <<: *review_handoffs
    actions: *review_actions

  - id: auto-review-fix-pr-missing-capability
    command: auto-review-fix-pr
    description: Stops after worktree attachment when the required external implementation capability is unavailable.
    expected:
      status: blocked
      successful_writes: [create-worktree]
      blocked_operation: handoff-external-implementation
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs:
      <<: *review_handoffs
      ContextCapabilities:
        patch:
          status: blocked
          missing_capabilities:
            - capability: session:skill:typescript-implementation
              type: skill
              relevance: required
              priority: high
              rationale: Project implementation knowledge is required.
              intended_usage: Apply the confirmed review-fix plan.
              availability: missing
              evidence: [Capability resolution returned no implementation skill.]
              confidence: high
              impact: blocking
          failure:
            code: insufficient_context
            message: Required implementation capability is unavailable.
            operation: resolve-feedback-capabilities
            retryable: false
    actions: *review_actions

  - id: auto-review-fix-pr-max-iterations
    command: auto-review-fix-pr
    description: Preserves a partial run when the five-iteration safety limit is reached.
    expected:
      status: partial
      successful_writes: [create-worktree, create-commit, push-branch]
      preserved_artifacts: []
    target: *target
    facts:
      max_iterations_reached: true
    authorizations: *authorizations
    handoffs:
      <<: *review_handoffs
    actions: *review_actions

  - id: auto-review-fix-pr-forbidden-review-publication
    command: auto-review-fix-pr
    description: Rejects a request to publish a GitHub review.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: submit-pr-review
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: submit-pr-review
        effect: write

  - id: auto-review-fix-pr-forbidden-draft-pr
    command: auto-review-fix-pr
    description: Rejects a request to create a second pull request.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: create-draft-pr
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: create-draft-pr
        effect: write

  - id: auto-review-fix-pr-forbidden-merge
    command: auto-review-fix-pr
    description: Rejects a request to merge the pull request.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: merge-pull-request
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: merge-pull-request
        effect: write
