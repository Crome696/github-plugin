schema: CommandScenario
version: 1
scenarios:
  - id: review-pr-happy-path
    command: review-pr
    description: Publishes one explicitly approved evidence-backed review comment.
    expected:
      status: completed
      successful_writes: [submit-pr-review]
      preserved_artifacts: []
    target:
      repository: &repo octo-org/widgets
      pull_request_number: &pr 7
      head_sha: &head aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      exact: true
    facts: {}
    authorizations:
      review_event: true
    handoffs:
      LoadedPullRequest:
        patch:
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
      ClassifiedReviewFindings:
        patch:
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          head_sha: *head
          findings: []
      ReviewDecision:
        patch:
          status: approved
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          head_sha: *head
          proposed_event: COMMENT
          summary: The changed behavior is covered by the supplied evidence.
          approval:
            exact_payload: true
            explicit_event_authorization: true
      PreReviewSubmitGate:
        patch:
          review_decision:
            status: approved
            repository: *repo
            pull_request:
              number: *pr
            head_sha: *head
            approval:
              exact_payload: true
              explicit_event_authorization: true
          freshness:
            head_sha: *head
            pull_request_state: open
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
        handoff: LoadedPullRequest
      - operation: analyze-pr-diff
        effect: read
      - operation: classify-review-findings
        effect: read
        handoff: ClassifiedReviewFindings
      - operation: compose-review
        effect: read
        handoff: ReviewDecision
      - operation: submit-pr-review
        effect: write
        handoff: ReviewDecision

  - id: review-pr-missing-pull-request
    command: review-pr
    description: Refuses review publication when the pull-request target is missing.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: submit-pr-review
      preserved_artifacts: []
    target:
      repository: octo-org/widgets
      pull_request_number: null
      exact: false
    facts: {}
    authorizations:
      review_event: true
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
      - operation: submit-pr-review
        effect: write

  - id: review-pr-unconfirmed-blocker
    command: review-pr
    description: Does not publish REQUEST_CHANGES for an unconfirmed review blocker.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: submit-pr-review
      preserved_artifacts: []
    target:
      repository: *repo
      pull_request_number: *pr
      head_sha: *head
      exact: true
    facts: {}
    authorizations:
      review_event: true
      review_request_changes: false
    handoffs:
      ClassifiedReviewFindings:
        patch:
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          head_sha: *head
          findings: []
      ReviewDecision:
        patch:
          status: draft
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          head_sha: *head
          proposed_event: REQUEST_CHANGES
          approval:
            exact_payload: false
            explicit_event_authorization: false
      PreReviewSubmitGate:
        patch:
          review_decision:
            status: approved
            repository: *repo
            pull_request:
              number: *pr
            head_sha: *head
            approval:
              exact_payload: true
              explicit_event_authorization: true
          freshness:
            head_sha: *head
            pull_request_state: open
    actions:
      - operation: verify-repository
        effect: read
      - operation: analyze-pr-diff
        effect: read
      - operation: classify-review-findings
        effect: read
      - operation: compose-review
        effect: read
      - operation: submit-pr-review
        effect: write
        handoff: ReviewDecision

  - id: review-pr-api-error
    command: review-pr
    description: Reports an ambiguous review API failure without claiming publication.
    expected:
      status: partial
      successful_writes: []
      blocked_operation: submit-pr-review
      preserved_artifacts: []
    target:
      repository: *repo
      pull_request_number: *pr
      head_sha: *head
      exact: true
    facts:
      api_errors: [submit-pr-review]
    authorizations:
      review_event: true
    handoffs:
      ReviewDecision:
        patch:
          status: approved
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          head_sha: *head
          proposed_event: COMMENT
          approval:
            exact_payload: true
            explicit_event_authorization: true
      PreReviewSubmitGate:
        patch:
          review_decision:
            status: approved
            repository: *repo
            pull_request:
              number: *pr
            head_sha: *head
            approval:
              exact_payload: true
              explicit_event_authorization: true
          freshness:
            head_sha: *head
            pull_request_state: open
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
      - operation: compose-review
        effect: read
      - operation: submit-pr-review
        effect: write
        result: api-error
