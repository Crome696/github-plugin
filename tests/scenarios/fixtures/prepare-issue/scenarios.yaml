schema: CommandScenario
version: 1
scenarios:
  - id: prepare-issue-happy-path
    command: prepare-issue
    description: Builds a task plan and creates one verified isolated workspace.
    expected:
      status: completed
      successful_writes: [create-worktree]
      preserved_artifacts: []
    target:
      repository: &repo octo-org/widgets
      issue_number: &issue 42
      exact: true
    facts: {}
    authorizations:
      routine: true
      workspace_creation: true
    handoffs:
      LoadedIssue: {}
      ImplementationPlan:
        patch:
          status: approved
          issue:
            repository: *repo
            number: *issue
      BranchWorkspace:
        patch:
          status: planned
          repository: *repo
          base_branch: main
          branch_name: agent/issue-42
          worktree_path: C:/workspace/github-issue-42
          isolation_mode: dedicated_worktree
          primary_checkout_untouched: true
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-issue
        effect: read
        handoff: LoadedIssue
      - operation: build-implementation-plan
        effect: read
        handoff: ImplementationPlan
      - operation: create-worktree
        effect: write
        handoff: BranchWorkspace
      - operation: verify-worktree
        effect: read
        handoff: BranchWorkspace

  - id: prepare-issue-missing-issue
    command: prepare-issue
    description: Does not create a workspace without a verified issue identity.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: create-worktree
      preserved_artifacts: []
    target:
      repository: octo-org/widgets
      issue_number: null
      exact: false
    facts: {}
    authorizations:
      routine: true
      workspace_creation: true
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-issue
        effect: read
      - operation: build-implementation-plan
        effect: read
      - operation: create-worktree
        effect: write

  - id: prepare-issue-load-api-error
    command: prepare-issue
    description: Stops planning before workspace creation when issue loading fails.
    expected:
      status: partial
      successful_writes: []
      blocked_operation: load-issue
      preserved_artifacts: []
    target:
      repository: octo-org/widgets
      issue_number: 42
      exact: true
    facts:
      api_errors: [load-issue]
    authorizations:
      routine: true
      workspace_creation: true
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-issue
        effect: read
        result: api-error
      - operation: build-implementation-plan
        effect: read
      - operation: create-worktree
        effect: write

  - id: prepare-issue-workspace-conflict
    command: prepare-issue
    description: Preserves a conflicting workspace instead of taking it over.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: create-worktree
      preserved_artifacts: []
    target:
      repository: octo-org/widgets
      issue_number: 42
      exact: true
    facts:
      recoverable_work: true
    authorizations:
      routine: true
      workspace_creation: true
    handoffs:
      ImplementationPlan:
        patch:
          status: approved
          issue:
            repository: octo-org/widgets
            number: 42
      BranchWorkspace:
        patch:
          status: completed
          repository: octo-org/widgets
          primary_checkout_untouched: true
    actions:
      - operation: verify-repository
        effect: read
      - operation: build-implementation-plan
        effect: read
      - operation: create-worktree
        effect: write
