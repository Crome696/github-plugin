    handoffs:
      LoadedPullRequest:
        patch:
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          state: open
          is_draft: false
      LinkedIssue:
        patch:
          status: loaded
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          primary_issue:
            repository: *repo
            number: 42
            url: https://github.com/octo-org/widgets/issues/42
          ambiguous_candidates: []
      PullRequestReady:
        patch:
          status: already_ready
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          expected_head_sha: *head
          draft_state:
            before: false
            after: false
          linked_issue:
            repository: *repo
            number: 42
            url: https://github.com/octo-org/widgets/issues/42
            unique: true
          authorization:
            exact_target: true
            exact_ready_operation: true
            ready_authorized: true
            reviewers_authorized: true
            source: explicit_user
            evidence: User authorized Ready-for-Review identity verification for the already non-Draft pull/7.
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
        handoff: LoadedPullRequest
      - operation: load-linked-issue
        effect: read
        handoff: LinkedIssue
      - operation: inspect-pr-checks
        effect: read
      - operation: propose-pr-reviewers
        effect: read
        handoff: PullRequestReady
      - operation: mark-pr-ready
        effect: write
        handoff: PullRequestReady

