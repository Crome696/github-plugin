            url: https://github.com/octo-org/widgets/issues/42
            unique: false
          authorization:
            exact_target: true
            exact_ready_operation: true
            ready_authorized: true
            reviewers_authorized: true
            source: explicit_user
            evidence: User authorized Ready-for-Review for pull/7 without a unique linked issue.
      PrePrReadyGate:
        patch:
