schema: CommandScenario
version: 1
scenarios:
  - id: ready-pr-happy-path
    command: ready-pr
    description: Marks one authorized open Draft pull request Ready-for-Review with a unique linked issue.
    expected:
      status: completed
      successful_writes: [mark-pr-ready]
      preserved_artifacts: []
    target:
      repository: &repo octo-org/widgets
      pull_request_number: &pr 7
      head_sha: &head aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      exact: true
    facts: {}
    authorizations:
      pr_ready: true
    handoffs:
      LoadedPullRequest:
        patch:
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          state: open
          is_draft: true
      LinkedIssue:
        patch:
          status: loaded
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          primary_issue:
            repository: *repo
            number: 42
            url: https://github.com/octo-org/widgets/issues/42
          ambiguous_candidates: []
      PullRequestReady:
        patch:
          status: approved
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          expected_head_sha: *head
          draft_state:
            before: true
            after: null
          linked_issue:
            repository: *repo
            number: 42
            url: https://github.com/octo-org/widgets/issues/42
            unique: true
          authorization:
            exact_target: true
            exact_ready_operation: true
            ready_authorized: true
            reviewers_authorized: true
            source: explicit_user
            evidence: User authorized Ready-for-Review for pull/7 at the current head with an empty reviewer set.
      PrePrReadyGate:
        patch:
          workspace:
            repository: *repo
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          expected_head_sha: *head
          is_draft: true
          linked_issue:
            repository: *repo
            number: 42
            url: https://github.com/octo-org/widgets/issues/42
            unique: true
          authorization:
            exact_target: true
            exact_ready_operation: true
            ready_authorized: true
            reviewers_authorized: true
            source: explicit_user
            evidence: User authorized Ready-for-Review for pull/7 at the current head with an empty reviewer set.
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
        handoff: LoadedPullRequest
      - operation: load-linked-issue
        effect: read
        handoff: LinkedIssue
      - operation: inspect-pr-checks
        effect: read
      - operation: propose-pr-reviewers
        effect: read
        handoff: PullRequestReady
      - operation: mark-pr-ready
        effect: write
        handoff: PullRequestReady

  - id: ready-pr-already-ready
