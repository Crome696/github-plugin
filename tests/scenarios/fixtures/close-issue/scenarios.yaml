  - id: close-issue-auth-bypass
    command: close-issue
    description: Blocks triage close when independent authorization is missing.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: close-github-issue
      preserved_artifacts: []
    target:
      repository: *repo
      issue_number: *issue
      exact: true
    facts: {}
    authorizations:
      issue_close: false
    handoffs:
      LoadedIssue:
        patch:
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          state: open
      IssueClosure:
        patch:
          status: approved
          repository: *repo
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          close_reason: not_planned
          github_state_reason: not_planned
          comment: Closed as not planned.
          authorization:
            exact_target: true
            exact_close_operation: true
            close_authorized: true
