schema: CommandScenario
version: 1
scenarios:
  - id: close-issue-happy-path
    command: close-issue
    description: Closes one authorized open issue as not planned without a merged pull request.
    expected:
      status: completed
      successful_writes: [close-github-issue]
      preserved_artifacts: []
    target:
      repository: &repo octo-org/widgets
      issue_number: &issue 42
      exact: true
    facts: {}
    authorizations:
      issue_close: true
    handoffs:
      LoadedIssue:
        patch:
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          state: open
      IssueClosure:
        patch:
          status: approved
          repository: *repo
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          close_reason: not_planned
          github_state_reason: not_planned
          comment: Closed as not planned.
          authorization:
            exact_target: true
            exact_close_operation: true
            close_authorized: true
            close_reason_authorized: true
            source: explicit_user
            evidence: User authorized closing issue 42 as not_planned.
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-github-issue
        effect: read
        handoff: LoadedIssue
      - operation: close-github-issue
        effect: write
        handoff: IssueClosure

  - id: close-issue-duplicate-happy-path
    command: close-issue
    description: Closes one authorized open issue as a unique same-repository duplicate.
    expected:
      status: completed
      successful_writes: [close-github-issue]
      preserved_artifacts: []
    target:
      repository: *repo
      issue_number: *issue
      exact: true
    facts: {}
    authorizations:
      issue_close: true
    handoffs:
      LoadedIssue:
        patch:
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          state: open
      IssueClosure:
        patch:
          status: approved
          repository: *repo
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          close_reason: duplicate
          duplicate_of:
            repository: *repo
            number: 10
            url: https://github.com/octo-org/widgets/issues/10
          github_state_reason: duplicate
          comment: Duplicate of octo-org/widgets#10.
          authorization:
            exact_target: true
            exact_close_operation: true
            close_authorized: true
            close_reason_authorized: true
            source: explicit_user
            evidence: User authorized closing issue 42 as duplicate of issue 10.
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-github-issue
        effect: read
        handoff: LoadedIssue
      - operation: close-github-issue
        effect: write
        handoff: IssueClosure

  - id: close-issue-already-closed
    command: close-issue
    description: Returns no-op for an already closed issue without writing.
    expected:
      status: completed
      successful_writes: [close-github-issue]
      preserved_artifacts: []
    target:
      repository: *repo
      issue_number: *issue
      exact: true
    facts: {}
    authorizations:
      issue_close: true
    handoffs:
      LoadedIssue:
        patch:
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          state: closed
      IssueClosure:
        patch:
          status: no-op
          repository: *repo
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          close_reason: not_planned
          github_state_reason: not_planned
          comment: Closed as not planned.
          authorization:
            exact_target: true
            exact_close_operation: true
            close_authorized: true
            close_reason_authorized: true
            source: explicit_user
            evidence: User requested closing issue 42 as not_planned; the live issue was already closed.
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-github-issue
        effect: read
        handoff: LoadedIssue
      - operation: close-github-issue
        effect: write
        handoff: IssueClosure

  - id: close-issue-missing-reason
    command: close-issue
    description: Blocks close when the close reason is missing and does not mutate GitHub.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: close-github-issue
      preserved_artifacts: []
    target:
      repository: *repo
      issue_number: *issue
      exact: true
    facts: {}
    authorizations:
      issue_close: true
    handoffs:
      LoadedIssue:
        patch:
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          state: open
      IssueClosure:
        patch:
          status: approved
          repository: *repo
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          close_reason: null
          github_state_reason: null
          authorization:
            exact_target: true
            exact_close_operation: true
            close_authorized: true
            close_reason_authorized: true
            source: explicit_user
            evidence: User authorized closing issue 42 without a close reason.
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-github-issue
        effect: read
        handoff: LoadedIssue
      - operation: close-github-issue
        effect: write
        handoff: IssueClosure

  - id: close-issue-ambiguous-duplicate
    command: close-issue
    description: Blocks a duplicate close when the duplicate target is missing.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: close-github-issue
      preserved_artifacts: []
    target:
      repository: *repo
      issue_number: *issue
      exact: true
    facts: {}
    authorizations:
      issue_close: true
    handoffs:
      LoadedIssue:
        patch:
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          state: open
      IssueClosure:
        patch:
          status: approved
          repository: *repo
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          close_reason: duplicate
          duplicate_of: null
          github_state_reason: duplicate
          authorization:
            exact_target: true
            exact_close_operation: true
            close_authorized: true
            close_reason_authorized: true
            source: explicit_user
            evidence: User authorized closing issue 42 as duplicate without a unique target.
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-github-issue
        effect: read
        handoff: LoadedIssue
      - operation: close-github-issue
