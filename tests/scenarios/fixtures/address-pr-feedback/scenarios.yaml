schema: CommandScenario
version: 1
scenarios:
  - id: address-pr-feedback-happy-path
    command: address-pr-feedback
    description: Replies to and resolves one addressed review thread under scoped feedback authorization.
    expected:
      status: completed
      successful_writes: [reply-to-review-thread, resolve-review-thread]
      preserved_artifacts: []
    target:
      repository: &repo octo-org/widgets
      pull_request_number: &pr 7
      head_sha: &head aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      exact: true
    facts: {}
    authorizations:
      feedback_reply: true
      feedback_resolution: true
    handoffs:
      FeedbackLifecyclePlan:
        patch:
          plan_id: address-feedback-plan
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
            head_sha: *head
            head_branch: feature/feedback
            base_branch: main
          mode: follow_up
          source_head_sha: *head
      FeedbackLifecycleRun:
        patch:
          lifecycle_run_id: address-feedback-run
          plan_id: address-feedback-plan
          status: follow_up_ready
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
            head_branch: feature/feedback
            base_branch: main
          mode: follow_up
          current_head_sha: *head
      ClassifiedReviewFeedback:
        patch:
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
            head_sha: *head
      FeedbackResolutionValidation:
        patch:
          status: validated
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
            baseline_head_sha: *head
            current_head_sha: *head
          results: []
          blockers: []
          uncertainties: []
      ReviewThreadReply:
        patch:
          status: draft
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          head_sha: *head
          lifecycle:
            run_id: address-feedback-run
            transition_id: transition-reply-1
            mode: follow_up
            effect: reply
            expected_head_sha: *head
            validated_head_sha: *head
          feedback_authorization:
            mode: feedback_lifecycle
            authorized: true
            repository: *repo
            pull_request_number: *pr
            feedback_item_id: F-001
            lifecycle_run_id: address-feedback-run
            transition_id: transition-reply-1
            effect: reply
            validation_reference: FeedbackResolutionValidation
            expected_head_sha: *head
            current_head_sha: *head
            evidence: [The command selected feedback item F-001.]
      ReviewThreadResolution:
        patch:
          status: approved
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          head_sha: *head
          lifecycle:
            run_id: address-feedback-run
            transition_id: transition-resolve-1
            mode: follow_up
            effect: resolve
            expected_head_sha: *head
            validated_head_sha: *head
          validation:
            status: addressed
            resolution_eligible: true
            evidence_references: [FeedbackResolutionValidation]
          platform:
            resolution_supported: true
          approval:
            exact_target: true
            resolution_authorized: false
          feedback_authorization:
            mode: feedback_lifecycle
            authorized: true
            repository: *repo
            pull_request_number: *pr
            feedback_item_id: F-001
            lifecycle_run_id: address-feedback-run
            transition_id: transition-resolve-1
            effect: resolve
            validation_reference: FeedbackResolutionValidation
            expected_head_sha: *head
            current_head_sha: *head
            evidence: [The command selected feedback item F-001.]
    actions:
      - operation: verify-repository
        effect: read
      - operation: collect-review-feedback
        effect: read
        handoff: ClassifiedReviewFeedback
      - operation: identify-resolved-feedback
        effect: read
      - operation: classify-review-feedback
        effect: read
      - operation: build-feedback-lifecycle-plan
        effect: read
        handoff: FeedbackLifecyclePlan
      - operation: reload-feedback-head
        effect: read
        handoff: FeedbackLifecycleRun
      - operation: validate-feedback-resolution
        effect: read
        handoff: FeedbackResolutionValidation
      - operation: reply-to-review-thread
        effect: write
        handoff: ReviewThreadReply
      - operation: resolve-review-thread
        effect: write
        handoff: ReviewThreadResolution

  - id: address-pr-feedback-missing-pull-request
    command: address-pr-feedback
    description: Does not touch review threads without an exact pull-request target.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: reply-to-review-thread
      preserved_artifacts: []
    target:
      repository: octo-org/widgets
      pull_request_number: null
      exact: false
    facts: {}
    authorizations:
      feedback_reply: true
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: collect-review-feedback
        effect: read
      - operation: identify-resolved-feedback
        effect: read
      - operation: reply-to-review-thread
        effect: write

