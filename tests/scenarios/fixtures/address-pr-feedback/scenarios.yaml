      pull_request_number: 7
      head_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      exact: true
    facts: {}
    authorizations:
      feedback_reply: true
    handoffs:
      FeedbackLifecyclePlan:
        patch:
          repository: octo-org/widgets
          pull_request:
            number: 7
            url: https://github.com/octo-org/widgets/pull/7
            head_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            head_branch: feature/feedback
            base_branch: main
          mode: follow_up
          source_head_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      FeedbackLifecycleRun:
        patch:
          lifecycle_run_id: address-unaddressed-run
          plan_id: feedback-plan-1
          status: follow_up_ready
          repository: octo-org/widgets
          pull_request:
            number: 7
            url: https://github.com/octo-org/widgets/pull/7
            head_branch: feature/feedback
            base_branch: main
          mode: follow_up
          current_head_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      FeedbackResolutionValidation:
        patch:
          status: partial
          pull_request:
            repository: octo-org/widgets
            number: 7
            current_head_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    actions:
      - operation: verify-repository
        effect: read
      - operation: collect-review-feedback
        effect: read
      - operation: identify-resolved-feedback
        effect: read
      - operation: classify-review-feedback
        effect: read
      - operation: build-feedback-lifecycle-plan
        effect: read
        handoff: FeedbackLifecyclePlan
      - operation: reload-feedback-head
        effect: read
        handoff: FeedbackLifecycleRun
      - operation: validate-feedback-resolution
        effect: read
      - operation: reply-to-review-thread
        effect: write

  - id: address-pr-feedback-api-error
    command: address-pr-feedback
    description: Reports a reply API failure without attempting thread resolution.
    expected:
      status: partial
      successful_writes: []
      blocked_operation: reply-to-review-thread
      preserved_artifacts: []
    target:
      repository: *repo
      pull_request_number: *pr
      head_sha: *head
      exact: true
    facts:
      api_errors: [reply-to-review-thread]
    authorizations:
      feedback_reply: true
    handoffs:
      FeedbackLifecyclePlan:
        patch:
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
            head_sha: *head
            head_branch: feature/feedback
            base_branch: main
          mode: follow_up
          source_head_sha: *head
      FeedbackLifecycleRun:
        patch:
          lifecycle_run_id: address-api-run
          plan_id: feedback-plan-1
          status: follow_up_ready
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
            head_branch: feature/feedback
            base_branch: main
          mode: follow_up
          current_head_sha: *head
      FeedbackResolutionValidation:
        patch:
          status: validated
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
            baseline_head_sha: *head
            current_head_sha: *head
          results: []
          blockers: []
          uncertainties: []
      ReviewThreadReply:
        patch:
          repository: *repo
          pull_request:
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
          head_sha: *head
          lifecycle:
            run_id: address-api-run
            transition_id: transition-api-reply
            mode: follow_up
            effect: reply
            expected_head_sha: *head
            validated_head_sha: *head
          feedback_authorization:
            mode: feedback_lifecycle
            authorized: true
            repository: *repo
            pull_request_number: *pr
            feedback_item_id: F-001
            lifecycle_run_id: address-api-run
            transition_id: transition-api-reply
            effect: reply
            validation_reference: FeedbackResolutionValidation
            expected_head_sha: *head
            current_head_sha: *head
            evidence: [The command selected feedback item F-001.]
    actions:
      - operation: verify-repository
        effect: read
      - operation: collect-review-feedback
        effect: read
      - operation: identify-resolved-feedback
        effect: read
      - operation: classify-review-feedback
        effect: read
      - operation: build-feedback-lifecycle-plan
        effect: read
        handoff: FeedbackLifecyclePlan
      - operation: reload-feedback-head
        effect: read
        handoff: FeedbackLifecycleRun
      - operation: validate-feedback-resolution
        effect: read
      - operation: reply-to-review-thread
        effect: write
        result: api-error

  - id: address-pr-feedback-merge-bypass
    command: address-pr-feedback
    description: Rejects an attempt to use feedback authorization for a merge.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: merge-pull-request
      preserved_artifacts: []
    target:
      repository: *repo
      pull_request_number: *pr
      head_sha: *head
      exact: true
    facts: {}
    authorizations:
      feedback_reply: true
      feedback_resolution: true
      merge: true
    handoffs:
      FeedbackResolutionValidation:
        patch:
          status: validated
          pull_request:
            repository: *repo
            number: *pr
            url: https://github.com/octo-org/widgets/pull/7
            baseline_head_sha: *head
            current_head_sha: *head
          results: []
          blockers: []
          uncertainties: []
    actions:
      - operation: verify-repository
        effect: read
      - operation: collect-review-feedback
        effect: read
      - operation: identify-resolved-feedback
        effect: read
      - operation: classify-review-feedback
        effect: read
      - operation: validate-feedback-resolution
        effect: read
      - operation: merge-pull-request
        effect: write
