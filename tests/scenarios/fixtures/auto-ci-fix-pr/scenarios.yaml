schema: CommandScenario
version: 1

defaults:
  repository: &repo octo-org/widgets
  pull_request_number: &pr 42
  head_sha: &head bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  head_branch: &branch feature/ci-fix
  worktree_path: &worktree C:/workspace/ci-fix
  target: &target
    repository: *repo
    pull_request_number: *pr
    head_sha: *head
    exact: true
  authorizations: &authorizations
    routine: true
    workspace_attachment: true
    commit: true
    push: true
    check_rerun: true
  ci_handoffs: &ci_handoffs
    LoadedPullRequest:
      patch:
        pull_request:
          repository: *repo
          number: *pr
          url: https://github.com/octo-org/widgets/pull/42
        title: CI-fix fixture
        state: open
        is_draft: false
        base:
          ref: main
          sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          repository: *repo
        head:
          ref: *branch
          sha: *head
          repository: *repo
    PullRequestCheckInspection:
      patch:
        status: inspected
        repository: *repo
        pull_request:
          number: *pr
          url: https://github.com/octo-org/widgets/pull/42
        base_branch: main
        head_sha: *head
        requirements:
          status: known
          evidence: [branch-protection required checks were retrieved.]
        required_checks:
          - name: test
            context: test
            sources: [branch_protection]
            evidence: [Branch protection lists test.]
        checks:
          - name: test
            context: test
            result: fail
            required: true
            evidence: The required test check failed on the current head.
        summary:
          total: 1
          pass: 0
          fail: 1
          pending: 0
          skipped: 0
          missing: 0
          required_pass: 0
          required_failed: 1
          required_pending: 0
          required_skipped: 0
          required_missing: 0
        failure: null
    RequiredCheckWait:
      patch:
        status: complete
        repository: *repo
        pull_request:
          number: *pr
          url: https://github.com/octo-org/widgets/pull/42
          head_branch: *branch
          base_branch: main
        head_sha: *head
        wait:
          timeout_seconds: 900
          poll_interval_seconds: 30
          polls_attempted: 3
          pending_treated_as_pass: false
        required_outcomes:
          - name: test
            context: test
            result: fail
            required: true
            evidence: [Required test remains failed after wait.]
        summary:
          required_total: 1
          pass: 0
          fail: 1
          pending: 0
          skipped: 0
          missing: 0
        policy_evidence:
          status: known
          evidence: [Branch protection lists test.]
        authorization:
          source: task_intent
          task_scope: pr:42
          wait_authorized: true
          evidence: [Task-scoped auto-ci-fix-pr authorization.]
        failure: null
    RequiredCheckRerun:
      patch:
        status: approved
        repository: *repo
        pull_request:
          number: *pr
          url: https://github.com/octo-org/widgets/pull/42
          head_branch: *branch
          base_branch: main
        head_sha: *head
        requested_checks: [test]
        authorized_checks: [test]
        verification:
          identity_matched: true
          new_runs_observed: true
          optional_checks_excluded: true
        authorization:
          source: task_intent
          task_scope: pr:42
          exact_check_names: [test]
          rerun_authorized: true
          evidence: [Exact required check names were authorized.]
        failure: null
    CiFixPlan:
      patch:
        status: confirmed
        pull_request:
          repository: *repo
          number: *pr
          url: https://github.com/octo-org/widgets/pull/42
          head_sha: *head
          head_branch: *branch
          base_branch: main
          title: CI-fix fixture
        candidate_items:
          - id: CI-001
            source: required_check
            source_references: [check:test]
            problem_core: The required test check failed on the current head.
            decision: fix
            decision_reason: Mandatory CI fix confirmed for this iteration.
            evidence:
              - Required test remains failed after wait.
            check_name: test
            location:
              path: src/feature.ts
              start_line: 10
              end_line: 10
            impact: Required CI remains red.
            correction: Fix the failing required test.
            success_criteria:
              - The required test check passes on the pushed head.
            risk: medium
        mandatory_item_ids: [CI-001]
        excluded_item_ids: []
        scope:
          in_scope: [src/feature.ts, tests/feature.test.ts]
          out_of_scope: [Review publication, merge, Ready-for-Review, optional checks]
          exact_path_allowlist: [src/feature.ts, tests/feature.test.ts]
          scope_evidence: [Candidate CI-001 names both affected paths.]
        implementation_steps:
          - id: fix-CI-001
            description: Fix the failing required test.
            item_ids: [CI-001]
            status: planned
            evidence: [Confirmed CiFixPlan candidate CI-001.]
        capabilities:
          required_skills: [session:skill:typescript-implementation]
          applicable_rules: [plugin/rules/interactive-approval.mdc]
          external_implementation:
            required: true
            capability_ids: [session:skill:typescript-implementation]
            status: available
            gaps: []
        workspace:
          operation: attach_existing_branch
          base_branch: main
          base_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          branch_name: *branch
          worktree_path: *worktree
          isolation_mode: dedicated_worktree
          existing_head_sha: *head
          primary_checkout_untouched: true
          verification_evidence: [Existing PR head branch is registered.]
        authorization:
          source: task_intent
          task_scope: pr:42
          routine_operations: [wait, check_rerun, workspace_attach, commit, push]
          exact_scope_approved: true
          commit_authorized: true
          push_authorized: true
          evidence: [Task-scoped auto-ci-fix-pr authorization.]
          forbidden_operations: [submit-pr-review, create-draft-pr, merge-pull-request, mark-pr-ready]
        blockers: []
        unresolved_questions: []
        validation:
          required_tests: [npm test -- feature]
          required_checks: [test]
          success_criteria: [Required test passes after the verified push.]
          reassess_required: true
        risks: []
        metadata:
          plan_id: ci-fix-plan-scenario
          iteration: 1
          created_at: '2026-01-01T00:00:00.000Z'
          updated_at: '2026-01-01T00:00:00.000Z'
          confirmation_source: user
        failure: null
    BranchWorkspace:
      patch:
        status: planned
        repository: *repo
        base_branch: main
        base_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        branch_name: *branch
        worktree_path: *worktree
        isolation_mode: dedicated_worktree
        primary_checkout_untouched: true
    ContextCapabilities:
      patch:
        status: resolved
        missing_capabilities: []
        failure: null
    WorkingTreeInspection:
      patch:
        status: inspected
        repository: *repo
        branch_name: *branch
        worktree_path: *worktree
        identity:
          branch_matches_expected: true
          worktree_registered: true
          is_primary_checkout: false
    ChangeClassification:
      patch:
        status: classified
        repository: *repo
        branch_name: *branch
        worktree_path: *worktree
        source:
          implementation_plan_version: null
          loaded_issue_version: null
          issue_analysis_version: null
          affected_areas_version: null
        summary:
          scope_alignment: aligned
        evidence: [Changed paths match CiFixPlan scope.]
    UnrelatedChangeDetection:
      patch:
        status: clear
        repository: *repo
        branch_name: *branch
        worktree_path: *worktree
        source:
          implementation_plan_version: null
          loaded_issue_version: null
          issue_analysis_version: null
          affected_areas_version: null
        findings: []
        blockers: []
        clarifications: []
    ValidationResult:
      patch:
        status: passed
        workspace:
          path: *worktree
          branch: *branch
          head_sha: *head
        checks: []
        required_checks_passed: true
        source:
          implementation_plan_version: null
          loaded_issue_version: null
          issue_analysis_version: null
          branch_workspace_version: 1
          references: [CiFixPlan]
          unavailable_inputs: []
        evaluation:
          scope:
            status: aligned
            evidence: [Changed paths match CiFixPlan scope.]
          acceptance_criteria: []
          completion_criteria: []
          planned_steps: []
          unexpected_changes: []
          documented_deviations: []
        blockers: []
        warnings: []
        readiness:
          commit_preparation_allowed: true
          draft_pr_preparation_allowed: false
          reasons: [CI-fix commit scope is validated.]
    CommitProposal:
      patch:
        status: approved
        repository: *repo
        branch: *branch
        base_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        head_sha: *head
        files:
          added: [tests/feature.test.ts]
          modified: [src/feature.ts]
          deleted: []
        message:
          subject: Fix required test failure
          body: Restore the required test on the existing pull-request head.
        validation:
          result_status: passed
          evidence: [ValidationResult passed with aligned CiFixPlan scope.]
        authorization:
          exact_scope_approved: true
          commit_authorized: true
          source: task_intent
          task_scope: pr:42
          evidence: Task-scoped CI-fix authorization.
    PreCommitGate:
      patch:
        workspace:
          repository: *repo
          path: *worktree
          branch: *branch
          head_sha: *head
        validation:
          status: passed
          readiness:
            commit_preparation_allowed: true
        commit_proposal:
          status: approved
          repository: *repo
          authorization:
            exact_scope_approved: true
            commit_authorized: true
    BranchPush:
      patch:
        status: verified
        repository: *repo
        branch_name: *branch
        worktree_path: *worktree
        remote:
          owner_repository: *repo
          url_sanitized: https://github.com/octo-org/widgets.git
        local:
          head_sha: *head
          branch_match: true
          dirty: false
          detached: false
          in_progress_operation: null
        push:
          attempted: true
          forced: false
          remote_sha: *head
          result: success
        authorization:
          push_authorized: true
          force_push_authorized: false
        verification:
          repository_match: pass
          branch_match: pass
          remote_branch_exists: pass
          sha_match: pass
          upstream_configured: pass
  ci_actions: &ci_actions
    - operation: verify-repository
      effect: read
    - operation: load-pull-request
      effect: read
    - operation: inspect-pr-checks
      effect: read
    - operation: check-required-status-checks
      effect: read
    - operation: wait-required-checks
      effect: read
    - operation: rerun-required-checks
      effect: write
    - operation: wait-required-checks
      effect: read
    - operation: build-ci-fix-plan
      effect: read
    - operation: create-worktree
      effect: write
    - operation: verify-worktree
      effect: read
    - operation: handoff-external-implementation
      effect: read
    - operation: inspect-working-tree
      effect: read
    - operation: classify-changes
      effect: read
    - operation: detect-unrelated-changes
      effect: read
    - operation: validate-implementation-result
      effect: read
    - operation: compose-commit-message
      effect: read
    - operation: create-commit
      effect: write
    - operation: push-branch
      effect: write
    - operation: wait-required-checks
      effect: read

scenarios:
  - id: auto-ci-fix-pr-happy-path
    command: auto-ci-fix-pr
    description: Waits, reruns the authorized required check, confirms a CI-fix plan, commits, pushes, and reassesses checks.
    expected:
      status: completed
      successful_writes: [rerun-required-checks, create-worktree, create-commit, push-branch]
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs:
      <<: *ci_handoffs
    actions: *ci_actions

  - id: auto-ci-fix-pr-wait-green
    command: auto-ci-fix-pr
    description: Completes when required checks pass after wait without rerun or delivery.
    expected:
      status: completed
      successful_writes: []
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs:
      <<: *ci_handoffs
      RequiredCheckWait:
        patch:
          required_outcomes:
            - name: test
              context: test
              result: pass
              required: true
              evidence: [Required test passed after wait.]
          summary:
            required_total: 1
            pass: 1
            fail: 0
            pending: 0
            skipped: 0
            missing: 0
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
      - operation: inspect-pr-checks
        effect: read
      - operation: check-required-status-checks
        effect: read
      - operation: wait-required-checks
        effect: read

  - id: auto-ci-fix-pr-rerun-only
    command: auto-ci-fix-pr
    description: Reruns only the authorized required check and stops without attaching a worktree.
    expected:
      status: completed
      successful_writes: [rerun-required-checks]
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs:
      <<: *ci_handoffs
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
      - operation: inspect-pr-checks
        effect: read
      - operation: check-required-status-checks
        effect: read
      - operation: wait-required-checks
        effect: read
      - operation: rerun-required-checks
        effect: write
      - operation: wait-required-checks
        effect: read

  - id: auto-ci-fix-pr-missing-identity
    command: auto-ci-fix-pr
    description: Stops before attaching a worktree when the exact pull-request identity is absent.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: rerun-required-checks
      preserved_artifacts: []
    target:
      <<: *target
      pull_request_number: null
      exact: false
    facts: {}
    authorizations: *authorizations
    handoffs:
      <<: *ci_handoffs
    actions: *ci_actions

  - id: auto-ci-fix-pr-missing-capability
    command: auto-ci-fix-pr
    description: Stops after worktree attachment when the required external implementation capability is unavailable.
    expected:
      status: blocked
      successful_writes: [rerun-required-checks, create-worktree]
      blocked_operation: handoff-external-implementation
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs:
      <<: *ci_handoffs
      ContextCapabilities:
        patch:
          status: blocked
          missing_capabilities:
            - capability: session:skill:typescript-implementation
              type: skill
              relevance: required
              priority: high
              rationale: Project implementation knowledge is required.
              intended_usage: Apply the confirmed CI-fix plan.
              availability: missing
              evidence: [Capability resolution returned no implementation skill.]
              confidence: high
              impact: blocking
          failure:
            code: insufficient_context
            message: Required implementation capability is unavailable.
            operation: resolve-feedback-capabilities
            retryable: false
    actions: *ci_actions

  - id: auto-ci-fix-pr-max-iterations
    command: auto-ci-fix-pr
    description: Preserves a partial run when the five-iteration safety limit is reached.
    expected:
      status: partial
      successful_writes: [rerun-required-checks, create-worktree, create-commit, push-branch]
      preserved_artifacts: []
    target: *target
    facts:
      max_iterations_reached: true
    authorizations: *authorizations
    handoffs:
      <<: *ci_handoffs
    actions: *ci_actions

  - id: auto-ci-fix-pr-wait-timeout
    command: auto-ci-fix-pr
    description: Returns partial when the bounded wait times out with required checks still pending.
    expected:
      status: partial
      successful_writes: []
      preserved_artifacts: []
    target: *target
    facts:
      wait_timeout: true
    authorizations: *authorizations
    handoffs:
      <<: *ci_handoffs
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
      - operation: inspect-pr-checks
        effect: read
      - operation: check-required-status-checks
        effect: read
      - operation: wait-required-checks
        effect: read

  - id: auto-ci-fix-pr-pending-not-pass
    command: auto-ci-fix-pr
    description: Rejects treating pending required checks as a pass.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: wait-required-checks
      preserved_artifacts: []
    target: *target
    facts:
      pending_as_pass: true
    authorizations: *authorizations
    handoffs:
      <<: *ci_handoffs
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
      - operation: inspect-pr-checks
        effect: read
      - operation: check-required-status-checks
        effect: read
      - operation: wait-required-checks
        effect: read

  - id: auto-ci-fix-pr-optional-as-required
    command: auto-ci-fix-pr
    description: Rejects rerunning an optional check as if it were required.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: rerun-required-checks
      preserved_artifacts: []
    target: *target
    facts:
      optional_check_as_required: true
    authorizations: *authorizations
    handoffs:
      <<: *ci_handoffs
    actions:
      - operation: verify-repository
        effect: read
      - operation: load-pull-request
        effect: read
      - operation: inspect-pr-checks
        effect: read
      - operation: check-required-status-checks
        effect: read
      - operation: wait-required-checks
        effect: read
      - operation: rerun-required-checks
        effect: write

  - id: auto-ci-fix-pr-forbidden-review-publication
    command: auto-ci-fix-pr
    description: Rejects a request to publish a GitHub review.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: submit-pr-review
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: submit-pr-review
        effect: write

  - id: auto-ci-fix-pr-forbidden-merge
    command: auto-ci-fix-pr
    description: Rejects a request to merge the pull request.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: merge-pull-request
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: merge-pull-request
        effect: write

  - id: auto-ci-fix-pr-forbidden-ready
    command: auto-ci-fix-pr
    description: Rejects a request to mark the pull request Ready-for-Review.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: mark-pr-ready
      preserved_artifacts: []
    target: *target
    facts: {}
    authorizations: *authorizations
    handoffs: {}
    actions:
      - operation: verify-repository
        effect: read
      - operation: mark-pr-ready
        effect: write
