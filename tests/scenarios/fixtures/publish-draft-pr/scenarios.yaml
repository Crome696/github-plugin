          evaluation:
            scope:
              status: drift
          readiness:
            commit_preparation_allowed: false
            draft_pr_preparation_allowed: false
      UnrelatedChangeDetection:
        patch:
          status: needs_clarification
          findings:
            - path: unrelated.txt
              previous_path: null
              change_kind: untracked
              verdict: scope_violation
              confidence: high
              rationale: The path is outside the approved issue scope.
              evidence: [WorkingTreeInspection identifies unrelated.txt.]
          blockers: []
      CommitProposal:
        patch:
          status: approved
          repository: octo-org/widgets
          authorization:
            exact_scope_approved: true
            commit_authorized: true
