schema: CommandScenario
version: 1
scenarios:
  - id: publish-draft-pr-happy-path
    command: publish-draft-pr
    description: Commits, pushes, and publishes exactly one validated Draft PR.
    expected:
      status: completed
      successful_writes: [create-commit, push-branch, create-draft-pr]
      preserved_artifacts: []
    target:
      repository: &repo octo-org/widgets
      issue_number: &issue 42
      exact: true
    facts: {}
    authorizations:
      routine: true
      commit: true
      push: true
      draft_pr: true
    handoffs:
      ImplementationPlan:
        patch:
          status: completed
          issue:
            repository: *repo
            number: *issue
      ValidationResult:
        patch:
          status: passed
          required_checks_passed: true
          evaluation:
            scope:
              status: aligned
            acceptance_criteria: []
            completion_criteria: []
            planned_steps: []
            unexpected_changes: []
            documented_deviations: []
          blockers: []
          generated_artifacts:
            - docs/ui-screenshots/preview.png
          readiness:
            commit_preparation_allowed: true
            draft_pr_preparation_allowed: true
      UnrelatedChangeDetection:
        patch:
          status: clear
          findings: []
          blockers: []
      CommitProposal:
        patch:
          status: approved
          repository: *repo
          branch: agent/issue-42
          files:
            added: [tests/scenarios/fixtures/publish-draft-pr/scenarios.yaml]
            modified: []
            deleted: []
          authorization:
            exact_scope_approved: true
            commit_authorized: true
            source: plan_build
            task_scope: issue-42
            evidence: Completed plan build for issue 42.
          validation:
            result_status: passed
            evidence: [ValidationResult passed with aligned scope.]
      PreCommitGate:
        patch:
          workspace:
            repository: *repo
            path: C:/workspace/github-issue-42
            branch: agent/issue-42
          validation:
            required_checks_passed: true
            generated_artifacts:
              - docs/ui-screenshots/preview.png
            readiness:
              commit_preparation_allowed: true
          commit_proposal:
            status: approved
            repository: *repo
            authorization:
              exact_scope_approved: true
              commit_authorized: true
      BranchPush: {}
      PullRequestDraft:
        patch:
          status: draft
          repository: *repo
          title: Publish validated GitHub Draft PR
          body: |
            ## Problem / issue context
            Issue 42 needs the validated implementation delivered.

            ## Solution summary
            The implementation is committed and pushed for review.

            ## Key changes and scope
            The exact approved scope is limited to the implementation.

            ## Tests and validations
            ValidationResult passed with required checks.

            ## Known limitations
            No known limitations.

            ## Risks
            No evidenced risks remain.

            ## Issue linkage
            Fixes octo-org/widgets#42
          base_branch: main
          head_branch: agent/issue-42
          head_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          draft: true
          linked_issues:
            - repository: *repo
              number: *issue
          authorization:
            push_authorized: true
            draft_pull_request_authorized: true
      PullRequestIssueLink:
        patch:
          repository: *repo
          issue:
            repository: *repo
            number: *issue
            url: https://github.com/octo-org/widgets/issues/42
          linked_issues:
            - repository: *repo
              number: *issue
      PrePrCreateGate:
        patch:
          validation:
            readiness:
              draft_pr_preparation_allowed: true
          pull_request_draft:
            repository: *repo
            draft: true
          issue_link:
            status: linked
    actions:
      - operation: verify-repository
        effect: read
      - operation: inspect-working-tree
        effect: read
      - operation: classify-changes
        effect: read
      - operation: validate-implementation-result
        effect: read
        handoff: ValidationResult
      - operation: create-commit
        effect: write
        handoff: CommitProposal
      - operation: push-branch
        effect: write
        phase: delivery
        handoff: BranchPush
      - operation: link-pr-to-issue
        effect: read
        handoff: PullRequestIssueLink
      - operation: create-draft-pr
        effect: write
        handoff: PullRequestDraft

