    authorizations:
      routine: true
      issue_publication: true
    handoffs:
      ProductPlannerRun:
        patch:
          status: publication_handed_off
          authorization:
            exact_payload: true
            exact_set: true
            publication_authorized: true
            canonical_set_digest: 14fe4d3066e06f84403b046657fbd932a067317bd283adb11d7e784963c0bf75
      ProductSubIssueDrafts:
        patch: {}
    actions: *plan_product_actions

  - id: plan-product-mutation-after-approval
    command: plan-product
    description: Blocks publication when the canonical payload changes after exact-set approval.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: create-product-sub-issues
      preserved_artifacts: []
    target:
      repository: *repo
      issue_number: *issue
      exact: true
    facts:
      mutation_after_approval: true
    authorizations:
      routine: true
      issue_publication: true
    handoffs:
      ProductPlannerRun:
        patch:
          status: publication_handed_off
          authorization:
            exact_payload: true
            exact_set: true
            publication_authorized: true
            canonical_set_digest: 14fe4d3066e06f84403b046657fbd932a067317bd283adb11d7e784963c0bf75
      ProductSubIssueDrafts:
        patch: {}
    actions: *plan_product_actions

  - id: plan-product-parent-overwrite
    command: plan-product
    description: Blocks publication when a canonical unit would overwrite the parent issue.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: create-product-sub-issues
      preserved_artifacts: []
    target:
      repository: *repo
      issue_number: *issue
      exact: true
    facts:
      parent_overwrite: true
    authorizations:
      routine: true
      issue_publication: true
    handoffs:
      ProductPlannerRun:
        patch:
          status: publication_handed_off
          authorization:
            exact_payload: true
            exact_set: true
            publication_authorized: true
            canonical_set_digest: 14fe4d3066e06f84403b046657fbd932a067317bd283adb11d7e784963c0bf75
      ProductSubIssueDrafts:
        patch: {}
    actions: *plan_product_actions

  - id: plan-product-retry-matching-digest
    command: plan-product
    description: Allows a retry when the verified mapping retains the exact canonical digest.
    expected:
      status: completed
      successful_writes: [create-product-sub-issues]
      preserved_artifacts: []
    target:
      repository: *repo
      issue_number: *issue
      exact: true
    facts:
      retry_matching_digest: true
    authorizations:
      routine: true
      issue_publication: true
    handoffs:
      ProductPlannerRun:
        patch:
          status: publication_handed_off
          authorization:
            exact_payload: true
            exact_set: true
            publication_authorized: true
            canonical_set_digest: 14fe4d3066e06f84403b046657fbd932a067317bd283adb11d7e784963c0bf75
      ProductSubIssueDrafts:
        patch: {}
    actions: *plan_product_actions

  - id: plan-product-retry-changed-digest
    command: plan-product
    description: Rejects retry reuse when the canonical digest changed.
    expected:
      status: blocked
      successful_writes: []
      blocked_operation: create-product-sub-issues
      preserved_artifacts: []
    target:
      repository: *repo
      issue_number: *issue
      exact: true
    facts:
      retry_digest_changed: true
    authorizations:
      routine: true
      issue_publication: true
    handoffs:
      ProductPlannerRun:
        patch:
          status: publication_handed_off
          authorization:
            exact_payload: true
            exact_set: true
            publication_authorized: true
            canonical_set_digest: 14fe4d3066e06f84403b046657fbd932a067317bd283adb11d7e784963c0bf75
      ProductSubIssueDrafts:
