drafts:
  - unit_id: unit-invoice-csv-export
    title: Export current-month invoices as CSV
    body: |
      ## Parent reference
      This issue is a sub-issue of octo-org/widgets#123.

      ## Problem and outcome
      Billing users manually collect invoice rows at month end. A billing user
      can download the current month's invoices as a CSV.

      ## Scope
      ### In scope
      - Export the current month's invoices.
      - Return an empty CSV when the month has no invoices.

      ### Out of scope
      - Saved payment methods.

      ## Behavior
      A billing user can request the export and receives a CSV containing the
      current month's invoices.

      ## Acceptance criteria
      - Given invoices exist for the current month, when the billing user
        requests the export, then the download contains those invoices as CSV.
      - Given no invoices exist for the current month, when the billing user
        requests the export, then the download is an empty valid CSV.

      ## Dependencies
      No hard dependency on a sibling unit is evidenced.

      ## Priority
      Must: the current increment depends on reducing the month-end manual
      collection process.

      ## Constraints
      None beyond the confirmed behavior and acceptance criteria.

      ## Traceability
      Parent capability: cap-billing-self-service. Original requirements:
      req-csv-export, req-empty-month.
